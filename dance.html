<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>霓虹舞厅</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        @keyframes fadeIn { to { opacity:1; } }
        @keyframes fadeOut {
            from { opacity:1; }
            to { opacity:0; }
        }
        @keyframes bgFlash {
            0% { background-position:0% 50%; }
            50% { background-position:100% 50%; }
            100% { background-position:0% 50%; }
        }
        @keyframes neonPulse {
            0%,100% { text-shadow: 0 0 8px #ff22aa, 0 0 20px #ff2288; }
            50% { text-shadow: 0 0 16px #ff22aa, 0 0 40px #ff2288,0 0 60px #ff44bb; }
        }
        body {
            opacity: 0;
            animation: fadeIn 1.2s ease forwards;
            background: linear-gradient(45deg, #050005, #2b0020, #550035, #200018);
            background-size: 400% 400%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #ffbbee;
            font-family: "微软雅黑", monospace;
            padding:20px;
            overflow-x:hidden;
            position:relative;
        }
        /* 背景舞蹈视频 */
        #bgVideo{
            position:fixed;
            inset:0;
            width:100%;
            height:100%;
            object-fit:cover;
            z-index:-2;
            opacity:0.35;
            display:none;
        }
        .video-mask{
            position:fixed;
            inset:0;
            background:rgba(30,0,25,0.6);
            z-index:-1;
        }
        .wrap{
            width:100%;
            max-width:720px;
            z-index:2;
        }
        h1 {
            font-size:42px;
            margin-bottom:20px;
            text-align:center;
            animation: neonPulse 2s ease infinite;
        }
        .card{
            background:#1a001a;
            border:2px solid #ff55cc;
            border-radius:12px;
            padding:20px;
            box-shadow:0 0 20px #ff229966;
            margin-bottom:16px;
        }
        .card-title{
            font-size:18px;
            margin-bottom:12px;
            color:#ffddff;
        }
        input,textarea{
            width:100%;
            padding:10px;
            margin:6px 0;
            background:#110011;
            border:1px solid #ff66bb;
            color:#ffbbee;
            border-radius:6px;
            font-size:14px;
        }
        textarea{
            min-height:100px;
            resize:vertical;
        }
        .btn-row{
            display:flex;
            gap:10px;
            flex-wrap:wrap;
            margin-top:10px;
            align-items:center;
        }
        button{
            padding:10px 16px;
            border:1px solid #ff77cc;
            background:#220022;
            color:#ffbbee;
            cursor:pointer;
            transition:0.3s;
            border-radius:6px;
            font-size:15px;
        }
        button:hover {
            background:#ff1177;
            box-shadow:0 0 14px #ff2299;
        }
        .lyric-box {
            height:220px;
            padding:15px;
            background:#110011;
            border-radius:8px;
            border:1px solid #ff44aa;
            overflow-y:auto;
            text-align:center;
            line-height:2.4;
            font-size:20px;
        }
        .lyric-line{
            transition:0.25s;
            opacity:0.45;
        }
        .lyric-line.active{
            color:#fff;
            opacity:1;
            text-shadow:0 0 10px #ff44bb;
            transform:scale(1.05);
        }
        .song-list{
            max-height:160px;
            overflow-y:auto;
            margin-top:8px;
        }
        .song-item{
            padding:8px 10px;
            border-bottom:1px solid #441133;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }
        .song-item .del{
            padding:4px 8px;
            font-size:12px;
        }
        .song-item .name-text{
            cursor:pointer;
        }
        .back-btn{
            width:100%;
            margin-top:8px;
            padding:14px;
            font-size:18px;
        }
        .vol-wrap{
            display:flex;
            align-items:center;
            gap:8px;
            width:100%;
            margin-top:8px;
        }
        #volSlider{
            flex:1;
        }
    </style>
</head>
<body>
    <video id="bgVideo" loop muted></video>
    <div class="video-mask"></div>
    <div class="wrap">
        <h1>✨ 霓虹舞厅 · K歌房 ✨</h1>

        <!-- 添加新歌表单 -->
        <div class="card">
            <div class="card-title">➕ 添加歌曲到歌单</div>
            <input id="songName" placeholder="歌曲名字">
            <input id="songSrc" placeholder="MP3音乐直链url">
            <textarea id="songLrc" placeholder="粘贴LRC歌词，格式示例：[00:00.00]第一句歌词"></textarea>
            <input id="videoSrc" placeholder="【可选】舞蹈背景视频mp4直链">
            <div class="btn-row">
                <button onclick="addSong()">加入歌单</button>
                <button onclick="toggleVideoBg()">切换视频背景</button>
                <button onclick="fullScreenLyric()">全屏K歌</button>
                <button onclick="lyricFontBigger()">字号+</button>
                <button onclick="lyricFontSmaller()">字号-</button>
            </div>
            <div class="btn-row" style="margin-top:12px;">
                <button onclick="exportList()">导出歌单</button>
                <button onclick="importList()">导入歌单</button>
            </div>
        </div>

        <!-- 播放器区域 -->
        <div class="card">
            <div class="card-title" id="nowName">当前：暂无歌曲</div>
            <audio id="audio" controls>
            <div class="vol-wrap">
                <span>音量</span>
                <input type="range" id="volSlider" min="0" max="1" step="0.01" value="0.8">
            </div>
            <div class="btn-row">
                <button onclick="prevSong()">上一首</button>
                <button onclick="nextSong()">下一首</button>
                <button id="modeBtn" onclick="changePlayMode()">模式：列表循环</button>
            </div>
        </div>

        <!-- KTV歌词 -->
        <div class="card">
            <div class="card-title">🎤 歌词</div>
            <div class="lyric-box" id="lyricWrap"></div>
        </div>

        <!-- 歌单列表 -->
        <div class="card">
            <div class="card-title">📜 我的歌单</div>
            <div class="song-list" id="songListDom"></div>
        </div>

        <button class="back-btn" onclick="goBack()">返回菜单</button>
    </div>

    <script>
        const audio = document.getElementById('audio');
        const lyricWrap = document.getElementById('lyricWrap');
        const songListDom = document.getElementById('songListDom');
        const nowNameDom = document.getElementById('nowName');
        const bgVideo = document.getElementById('bgVideo');
        const volSlider = document.getElementById('volSlider');
        const modeBtn = document.getElementById('modeBtn');

        let songList = JSON.parse(localStorage.getItem('danceSongList')) || [];
        let currentIndex = 0;
        let lyricArr = [];
        let videoOn = false;
        let playMode = 0; //0列表循环 1单曲循环 2随机播放
        let lyricFontSize = 20;

        volSlider.oninput = ()=>{
            audio.volume = volSlider.value;
        }
        audio.volume = volSlider.value;

        function renderList(){
            songListDom.innerHTML = '';
            songList.forEach((item,idx)=>{
                const div = document.createElement('div');
                div.className = 'song-item';
                div.innerHTML = `
                    <span class="name-text">${item.name}</span>
                    <button class="del">删除</button>
                `;
                div.querySelector('.name-text').onclick = ()=>playByIndex(idx);
                div.querySelector('.del').onclick = (e)=>{
                    e.stopPropagation();
                    songList.splice(idx,1);
                    saveList();
                    renderList();
                    if(songList.length===0){
                        audio.src = '';
                        nowNameDom.innerText = "当前：暂无歌曲";
                        lyricWrap.innerHTML = '';
                    }
                }
                songListDom.appendChild(div);
            })
        }
        function saveList(){
            localStorage.setItem('danceSongList', JSON.stringify(songList));
        }

        function addSong(){
            const name = document.getElementById('songName').value.trim();
            const src = document.getElementById('songSrc').value.trim();
            const lrc = document.getElementById('songLrc').value.trim();
            const vSrc = document.getElementById('videoSrc').value.trim();
            if(!name || !src){
                alert("歌曲名和MP3链接不能为空");
                return;
            }
            songList.push({name, src, lrc, video:vSrc});
            saveList();
            renderList();
            alert("添加成功！");
            document.getElementById('songName').value = '';
            document.getElementById('songSrc').value = '';
            document.getElementById('songLrc').value = '';
            document.getElementById('videoSrc').value = '';
        }

        function parseLrc(lrcText){
            const lines = lrcText.split('\n');
            const res = [];
            const reg = /\[(\d{2}):(\d{2})\.?(\d{0,2})\](.*)/;
            lines.forEach(line=>{
                const m = line.match(reg);
                if(!m) return;
                const min = Number(m[1]);
                const sec = Number(m[2]);
                const ms = Number(m[3]||0);
                const time = min*60 + sec + ms/100;
                const text = m[4].trim();
                if(text) res.push({time, text});
            })
            return res.sort((a,b)=>a.time-b.time);
        }

        function playByIndex(idx){
            if(songList.length === 0) return;
            currentIndex = idx;
            const song = songList[currentIndex];
            nowNameDom.innerText = "当前：" + song.name;
            audio.src = song.src;
            lyricArr = parseLrc(song.lrc);
            renderLyricDom();
            audio.play().catch(e=>{});
            if(song.video && videoOn){
                bgVideo.src = song.video;
                bgVideo.style.display = 'block';
            }else{
                bgVideo.style.display = 'none';
            }
        }
        function renderLyricDom(){
            lyricWrap.innerHTML = '';
            lyricWrap.style.fontSize = lyricFontSize + 'px';
            lyricArr.forEach((item,i)=>{
                const p = document.createElement('div');
                p.className = 'lyric-line';
                p.dataset.idx = i;
                p.innerText = item.text;
                lyricWrap.appendChild(p);
            })
        }
        audio.ontimeupdate = function(){
            const t = audio.currentTime;
            let activeIdx = -1;
            for(let i=0;i<lyricArr.length;i++){
                if(lyricArr[i].time <= t){
                    activeIdx = i;
                }else break;
            }
            document.querySelectorAll('.lyric-line').forEach(el=>{
                el.classList.remove('active');
                if(Number(el.dataset.idx) === activeIdx){
                    el.classList.add('active');
                    el.scrollIntoView({behavior:"smooth", block:"center"});
                }
            })
        }

        function nextSong(){
            if(songList.length === 0) return;
            if(playMode === 1){
                playByIndex(currentIndex);
                return;
            }else if(playMode === 2){
                let rnd;
                do{
                    rnd = Math.floor(Math.random() * songList.length);
                }while(rnd === currentIndex && songList.length>1);
                currentIndex = rnd;
            }else{
                currentIndex = (currentIndex+1) % songList.length;
            }
            playByIndex(currentIndex);
        }
        function prevSong(){
            if(songList.length === 0) return;
            if(playMode === 1){
                playByIndex(currentIndex);
                return;
            }else if(playMode === 2){
                let rnd;
                do{
                    rnd = Math.floor(Math.random() * songList.length);
                }while(rnd === currentIndex && songList.length>1);
                currentIndex = rnd;
            }else{
                currentIndex = (currentIndex -1 + songList.length) % songList.length;
            }
            playByIndex(currentIndex);
        }
        audio.onended = nextSong;

        function changePlayMode(){
            playMode = (playMode + 1) % 3;
            const txt = ['列表循环','单曲循环','随机播放'];
            modeBtn.innerText = "模式："+txt[playMode];
        }

        function toggleVideoBg(){
            videoOn = !videoOn;
            if(videoOn && songList[currentIndex]?.video){
                bgVideo.src = songList[currentIndex].video;
                bgVideo.style.display = 'block';
            }else{
                bgVideo.style.display = 'none';
            }
        }
        function fullScreenLyric(){
            lyricWrap.requestFullscreen?.() || lyricWrap.webkitRequestFullscreen?.();
        }
        function lyricFontBigger(){
            lyricFontSize += 2;
            lyricWrap.style.fontSize = lyricFontSize + 'px';
        }
        function lyricFontSmaller(){
            lyricFontSize = Math.max(12, lyricFontSize - 2);
            lyricWrap.style.fontSize = lyricFontSize + 'px';
        }

        // 导出歌单
        function exportList(){
            const jsonStr = JSON.stringify(songList,null,2);
            navigator.clipboard.writeText(jsonStr).then(()=>{
                alert("歌单JSON已经复制到剪贴板！保存好，之后导入使用");
            }).catch(()=>{
                prompt("复制下面全部文本保存", jsonStr);
            })
        }
        // 导入歌单
        function importList(){
            const raw = prompt("粘贴你之前导出的歌单文本：");
            if(!raw) return;
            try{
                const arr = JSON.parse(raw);
                if(Array.isArray(arr)){
                    songList = arr;
                    saveList();
                    renderList();
                    alert("导入成功！");
                }else{
                    alert("格式不对");
                }
            }catch(e){
                alert("解析失败，文本不是正确的歌单");
            }
        }

        function goBack(){
            document.body.style.animation = "fadeOut 0.9s ease forwards";
            setTimeout(()=>{
                location.href="secret.html";
            },800);
        }

        renderList();
    </script>
</body>
</html>
