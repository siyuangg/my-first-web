<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>梦境回廊</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        @keyframes fadeIn { to { opacity:1; } }
        @keyframes fadeOut {
            from { opacity:1; }
            to { opacity:0; }
        }
        @keyframes float {
            0%,100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }
        body {
            opacity: 0;
            animation: fadeIn 1.2s ease forwards;
            background: #120f22;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #e4ccff;
            font-family: "微软雅黑", monospace;
            position: relative;
            overflow: hidden;
        }
        .float-item{
            position:absolute;
            font-size:28px;
            animation: float 4s ease-in-out infinite;
            opacity:0.6;
        }
        .box {
            text-align:center;
            z-index:2;
        }
        h1 {
            font-size:48px;
            margin-bottom:40px;
            text-shadow: 0 0 14px #b377ff;
        }
        .back-btn {
            padding:14px 30px;
            font-size:20px;
            border:1px solid #bb88ee;
            background:#251840;
            color:#e4ccff;
            cursor:pointer;
            transition:0.3s;
        }
        .back-btn:hover {
            background:#552b88;
            box-shadow:0 0 20px #9955dd;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>🪞 梦境回廊</h1>
        <button class="back-btn" onclick="goBack()">返回菜单</button>
    </div>
    <script>
        //漂浮元素
        const emojis = ['☁','✦','◌','❀','⋆'];
        for(let i=0;i<12;i++){
            let el = document.createElement('div');
            el.className="float-item";
            el.innerText = emojis[Math.floor(Math.random()*emojis.length)];
            el.style.left = Math.random()*90 + "%";
            el.style.top = Math.random()*85 + "%";
            el.style.animationDelay = Math.random()*3 + "s";
            document.body.appendChild(el);
        }
        function goBack(){
            document.body.style.animation = "fadeOut 0.9s ease forwards";
            setTimeout(()=>{
                location.href="menu.html";
            },800);
        }
    </script>
</body>
</html>
