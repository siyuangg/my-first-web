<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>梦境回廊</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #22001a;
        }
        ::-webkit-scrollbar-thumb {
            background: #ff33aa;
            border-radius: 3px;
        }
        @keyframes fadeIn { to { opacity:1; } }
        @keyframes fadeOut {
            from { opacity:1; }
            to { opacity:0; }
        }
        @keyframes float {
            0%,100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }
        @keyframes glow {
            0%,100% { box-shadow: 0 0 12px #ff33aa66; }
            50% { box-shadow: 0 0 22px #ff33aa; }
        }
        @keyframes blink{
            0%,100%{opacity:0.2;transform:scale(0.75);}
            50%{opacity:1;transform:scale(1.2);}
        }
        @keyframes wishPop {
            0 {opacity:0; transform: scale(0.85);}
            100% {opacity:1; transform: scale(1);}
        }
        body {
            opacity: 0;
            animation: fadeIn 1.2s ease forwards;
            background: #440036;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 15px;
            color: #ffddf5;
            font-family: "微软雅黑", monospace;
            position: relative;
            overflow-x: hidden;
        }
        /* 流星背景 和menu、secret保持一致 */
        .star-field{
            position:fixed;inset:0;pointer-events:none;z-index:1;
        }
        .meteor{
            position:absolute;
            width:80px;
            height:2px;
            background:linear-gradient(90deg,#ff88dd,transparent);
            border-radius:99px;
            opacity:0;
            filter:drop-shadow(0 0 6px #ff44bb);
        }
        .float-item{
            position:absolute;
            font-size:28px;
            animation: float 4s ease-in-out infinite;
            opacity:0.6;
            z-index: 1;
        }
        .corner-star{
            position:absolute;
            color:#ffbbee;
            font-size:26px;
            filter:drop-shadow(0 0 8px #ff44bb);
            animation: blink 2.2s infinite;
            z-index:1;
        }
        .star-tl{top:10%;left:10%;}
        .star-tr{top:10%;right:10%;animation-delay:0.6s;}
        .star-bl{bottom:10%;left:10%;animation-delay:1.1s;}
        .star-br{bottom:10%;right:10%;animation-delay:1.7s;}

        .wrap{
            z-index:2;
            width:100%;
            max-width:620px;
        }
        h1 {
            font-size:42px;
            text-align:center;
            margin-bottom:24px;
            text-shadow: 0 0 14px #ff44bb;
        }
        /* 标签栏 */
        .tab-bar{
            display:flex;
            gap:8px;
            margin-bottom:20px;
        }
        .tab{
            flex:1;
            padding:12px;
            border:2px solid #ff33aa;
            background:#330028;
            color:#ffddf5;
            border-radius:10px;
            cursor:pointer;
            transition:0.3s;
        }
        .tab.active{
            background:#ff1188;
            box-shadow:0 0 15px #ff33aa;
        }
        .tab:hover:not(.active){
            background:#ff118844;
        }
        .panel{
            display:none;
            background:#330028;
            border:2px solid #ff33aa;
            border-radius:14px;
            padding:24px;
            box-shadow:0 0 20px #ff33aa77;
            transition: all 0.3s;
        }
        .panel.show{
            display:block;
        }
        textarea{
            width:100%;
            min-height:130px;
            padding:14px;
            background:#22001a;
            border:2px solid #ff33aa;
            border-radius:10px;
            color:#ffddf5;
            outline:none;
            resize:vertical;
            font-size:16px;
        }
        .btn-row{
            display:flex;
            gap:10px;
            margin-top:14px;
            flex-wrap:wrap;
        }
        button{
            padding:12px 16px;
            border-radius:9px;
            border:none;
            font-size:16px;
            cursor:pointer;
            transition:0.3s;
        }
        .btn-main{
            background:#ff1188;
            color:#fff;
            flex:1;
        }
        .btn-main:hover{
            box-shadow:0 0 16px #ff44bb;
            background:#ff33aa;
        }
        .btn-other{
            background:#550044;
            color:#ffddf5;
            border:1px solid #ff33aa;
        }
        .dream-list{
            margin-top:18px;
            display:flex;
            flex-direction:column;
            gap:12px;
            max-height:320px;
            overflow-y:auto;
            padding-right:4px;
        }
        .dream-card{
            padding:14px;
            background:#4a1b3c;
            border-radius:10px;
            position:relative;
        }
        .dream-card .time{
            font-size:12px;
            color:#ffbbee88;
            margin-bottom:8px;
            display:block;
        }
        .dream-card .btn-group{
            display:flex;
            gap:6px;
            margin-top:8px;
        }
        .dream-card .del, .dream-card .edit{
            padding:3px 7px;
            font-size:12px;
            border-radius:4px;
        }
        .dream-card .del{
            background:#ff4444;
            color:white;
        }
        .dream-card .edit{
            background:#4488ff;
            color:white;
        }
        /* 画廊 */
        .gallery-grid{
            margin-top:16px;
            display:grid;
            grid-template-columns:repeat(auto-fill, minmax(140px,1fr));
            gap:12px;
            max-height:320px;
            overflow-y:auto;
        }
        .gallery-item{
            border-radius:10px;
            overflow:hidden;
            border:1px solid #ff33aa;
            position:relative;
            cursor:pointer;
        }
        .gallery-item img{
            width:100%;
            display:block;
            aspect-ratio:1/1;
            object-fit:cover;
        }
        .gallery-item .del{
            position:absolute;
            right:4px;
            top:4px;
            background:#ff4444;
            color:white;
            border:none;
            font-size:11px;
            padding:3px 5px;
            z-index:2;
        }
        input[type="file"]{
            width:100%;
            margin-top:10px;
            color:#ffddf5;
        }
        .empty-tip{
            text-align:center;
            padding:30px 10px;
            color:#ffbbee77;
        }
        /* 图片放大弹窗 */
        .img-modal{
            position:fixed;
            inset:0;
            background:rgba(0,0,0,0.85);
            z-index:99;
            display:none;
            align-items:center;
            justify-content:center;
            padding:20px;
        }
        .img-modal img{
            max-width:90%;
            max-height:90%;
            border:2px solid #ff33aa;
            border-radius:12px;
        }
        .img-modal .close{
            position:absolute;
            top:20px;
            right:20px;
            color:white;
            font-size:32px;
            cursor:pointer;
        }
        /* 抽签弹窗 */
        .draw-box{
            margin-top:20px;
            min-height:160px;
            display:flex;
            align-items:center;
            justify-content:center;
            text-align:center;
            font-size:20px;
            padding:16px;
            background:#4a1b3c;
            border-radius:10px;
        }
        .draw-box.pop{
            animation: wishPop 0.4s ease;
        }
        .back-btn {
            margin-top:24px;
            width:100%;
            padding:14px 30px;
            font-size:20px;
            border:1px solid #ff33aa;
            background:#330028;
            color:#ffddf5;
            cursor:pointer;
            transition:0.3s;
        }
        .back-btn:hover {
            background:#ff118844;
            box-shadow:0 0 20px #ff33aa;
        }
    </style>
</head>
<body>
    <div class="star-field" id="meteorWrap"></div>
    <div class="corner-star star-tl">✦</div>
    <div class="corner-star star-tr">✦</div>
    <div class="corner-star star-bl">✦</div>
    <div class="corner-star star-br">✦</div>

    <div class="wrap">
        <h1>🪞 梦境回廊</h1>
        <!-- 标签切换 -->
        <div class="tab-bar">
            <div class="tab active" data-target="note">📜 梦境碎碎念</div>
            <div class="tab" data-target="gallery">🖼️ 梦境画廊</div>
            <div class="tab" data-target="wish">🎐 许愿抽签</div>
        </div>

        <!-- 碎碎念面板 -->
        <div class="panel show" id="note">
            <textarea id="note-input" placeholder="写下一闪而过的梦境、幻想碎片..."></textarea>
            <div class="btn-row">
                <button class="btn-main" onclick="saveNote()">存入梦境</button>
            </div>
            <div class="dream-list" id="note-list"></div>
        </div>

        <!-- 画廊面板 -->
        <div class="panel" id="gallery">
            <input type="file" id="img-input" accept="image/*">
            <div class="gallery-grid" id="gallery-list"></div>
        </div>

        <!-- 许愿抽签面板 -->
        <div class="panel" id="wish">
            <textarea id="wish-input" placeholder="在这里许下心愿，沉入梦里..."></textarea>
            <div class="btn-row">
                <button class="btn-main" onclick="saveWish()">沉入梦境</button>
                <button class="btn-other" onclick="drawWish()">抽取旧梦</button>
                <button class="btn-other" onclick="clearAllWish()">清空全部愿望</button>
            </div>
            <div class="draw-box" id="wish-result">
                等待抽取梦境...
            </div>
            <div class="dream-list" id="wish-history-list" style="margin-top:16px;"></div>
        </div>

        <button class="back-btn" onclick="goBack()">返回菜单</button>
    </div>
    <!-- 图片预览弹窗 -->
    <div class="img-modal" id="imgModal">
        <span class="close" onclick="closeModal()">×</span>
        <img id="modalImg">
    </div>

    <script>
        let leaving = false;
        //漂浮元素
        const emojis = ['☁','✦','◌','❀','⋆'];
        for(let i=0;i<12;i++){
            let el = document.createElement('div');
            el.className="float-item";
            el.innerText = emojis[Math.floor(Math.random()*emojis.length)];
            el.style.left = Math.random()*90 + "%";
            el.style.top = Math.random()*85 + "%";
            el.style.animationDelay = Math.random()*3 + "s";
            document.body.appendChild(el);
        }
        //流星动画 同secret、menu
        function spawnMeteor(){
            const m = document.createElement("div");
            m.className="meteor";
            const w = window.innerWidth;
            const h = window.innerHeight;
            m.style.left = Math.random()*w+"px";
            m.style.top = Math.random()*h*0.6+"px";
            m.style.transform = `rotate(${25+Math.random()*20}deg)`;
            document.getElementById("meteorWrap").appendChild(m);
            m.animate([
                {opacity:0,translate:"0 0"},
                {opacity:1},
                {opacity:0,translate:"120px 120px"}
            ],{duration:1200+Math.random()*1000,easing:"linear"});
            setTimeout(()=>m.remove(),2500);
        }
        setInterval(spawnMeteor,2200);

        //标签切换
        const tabs = document.querySelectorAll(".tab");
        const panels = document.querySelectorAll(".panel");
        tabs.forEach(tab=>{
            tab.onclick = ()=>{
                tabs.forEach(t=>t.classList.remove("active"));
                panels.forEach(p=>p.classList.remove("show"));
                tab.classList.add("active");
                const targetId = tab.dataset.target;
                document.getElementById(targetId).classList.add("show");
                if(targetId === "wish") renderWishHistory();
            }
        })

        //===== 梦境碎碎念 note =====
        function getNotes(){
            return JSON.parse(localStorage.getItem("dream_notes")) || [];
        }
        function renderNotes(){
            const listBox = document.getElementById("note-list");
            listBox.innerHTML = "";
            const arr = getNotes();
            if(arr.length === 0){
                listBox.innerHTML = `<div class="empty-tip">还没有梦境碎片，写下第一个梦吧 ✧</div>`;
                return;
            }
            arr.forEach((item,idx)=>{
                const div = document.createElement("div");
                div.className="dream-card";
                div.innerHTML = `
                    <span class="time">📅 ${item.time}</span>
                    <p>${item.content}</p>
                    <div class="btn-group">
                        <button class="edit" onclick="editNote(${idx})">编辑</button>
                        <button class="del" onclick="delNote(${idx})">删除</button>
                    </div>
                `
                listBox.appendChild(div);
            })
        }
        function saveNote(){
            const val = document.getElementById("note-input").value.trim();
            if(!val) return alert("不能是空梦境哦");
            const arr = getNotes();
            arr.push({
                content: val,
                time: new Date().toLocaleString()
            });
            localStorage.setItem("dream_notes",JSON.stringify(arr));
            document.getElementById("note-input").value = "";
            renderNotes();
        }
        function editNote(idx){
            const arr = getNotes();
            const target = arr[idx];
            const newText = prompt("修改梦境碎片：", target.content);
            if(newText === null) return;
            const trimText = newText.trim();
            if(!trimText) return alert("内容不能为空！");
            arr[idx].content = trimText;
            arr[idx].time = new Date().toLocaleString();
            localStorage.setItem("dream_notes",JSON.stringify(arr));
            renderNotes();
        }
        function delNote(idx){
            if(!confirm("确定删除这条梦境碎片？")) return;
            const arr = getNotes();
            arr.splice(idx,1);
            localStorage.setItem("dream_notes",JSON.stringify(arr));
            renderNotes();
        }
        renderNotes();

        //===== 梦境画廊 gallery（base64存图）=====
        function getGallery(){
            return JSON.parse(localStorage.getItem("dream_gallery")) || [];
        }
        function renderGallery(){
            const box = document.getElementById("gallery-list");
            box.innerHTML = "";
            const arr = getGallery();
            if(arr.length === 0){
                box.innerHTML = `<div class="empty-tip">画廊空空，上传属于梦境的画面 ✧</div>`;
                return;
            }
            arr.forEach((src,idx)=>{
                const div = document.createElement("div");
                div.className="gallery-item";
                div.innerHTML = `
                    <img src="${src}" onclick="openModal('${src}')">
                    <button class="del" onclick="event.stopPropagation();delImg(${idx})">×</button>
                `
                box.appendChild(div);
            })
        }
        function openModal(src){
            document.getElementById("modalImg").src = src;
            document.getElementById("imgModal").style.display = "flex";
        }
        function closeModal(){
            document.getElementById("imgModal").style.display = "none";
        }
        document.getElementById("img-input").onchange = function(e){
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = function(ev){
                const arr = getGallery();
                arr.push(ev.target.result);
                localStorage.setItem("dream_gallery",JSON.stringify(arr));
                renderGallery();
            }
            reader.onerror = ()=>alert("图片读取失败！");
            reader.readAsDataURL(file);
        }
        function delImg(idx){
            if(!confirm("确定删除这张梦境图片？")) return;
            const arr = getGallery();
            arr.splice(idx,1);
            localStorage.setItem("dream_gallery",JSON.stringify(arr));
            renderGallery();
        }
        renderGallery();

        //===== 许愿抽签 wish =====
        function getWishes(){
            return JSON.parse(localStorage.getItem("dream_wishes")) || [];
        }
        function saveWish(){
            const val = document.getElementById("wish-input").value.trim();
            if(!val) return alert("愿望不能为空");
            const arr = getWishes();
            arr.push({
                content: val,
                time: new Date().toLocaleString()
            });
            localStorage.setItem("dream_wishes",JSON.stringify(arr));
            document.getElementById("wish-input").value = "";
            alert("愿望沉入梦境 ✨");
            renderWishHistory();
        }
        function drawWish(){
            const arr = getWishes();
            if(arr.length === 0){
                document.getElementById("wish-result").innerText = "还没有任何愿望，先许下心愿吧";
                return;
            }
            const randomOne = arr[Math.floor(Math.random() * arr.length)];
            const box = document.getElementById("wish-result");
            box.classList.remove("pop");
            void box.offsetWidth;
            box.classList.add("pop");
            box.innerText = `【${randomOne.time}】\n${randomOne.content}`;
        }
        function renderWishHistory(){
            const listBox = document.getElementById("wish-history-list");
            listBox.innerHTML = "";
            const arr = getWishes();
            if(arr.length === 0){
                listBox.innerHTML = `<div class="empty-tip">还没有保存的愿望</div>`;
                return;
            }
            arr.forEach((item,idx)=>{
                const div = document.createElement("div");
                div.className="dream-card";
                div.innerHTML = `
                    <span class="time">📅 ${item.time}</span>
                    <p>${item.content}</p>
                    <div class="btn-group">
                        <button class="edit" onclick="editWish(${idx})">修改</button>
                        <button class="del" onclick="delWish(${idx})">删除</button>
                    </div>
                `
                listBox.appendChild(div);
            })
        }
        function editWish(idx){
            const arr = getWishes();
            const target = arr[idx];
            const newText = prompt("修改愿望：", target.content);
            if(newText === null) return;
            const trimText = newText.trim();
            if(!trimText) return alert("愿望不能为空！");
            arr[idx].content = trimText;
            arr[idx].time = new Date().toLocaleString();
            localStorage.setItem("dream_wishes",JSON.stringify(arr));
            renderWishHistory();
        }
        function delWish(idx){
            if(!confirm("确定删除这条愿望？")) return;
            const arr = getWishes();
            arr.splice(idx,1);
            localStorage.setItem("dream_wishes",JSON.stringify(arr));
            renderWishHistory();
        }
        function clearAllWish(){
            if(!confirm("⚠️ 确定清空全部愿望？该操作不可恢复！")) return;
            localStorage.removeItem("dream_wishes");
            document.getElementById("wish-result").innerText = "等待抽取梦境...";
            renderWishHistory();
        }

        // 返回菜单动画，防止多次点击
        function goBack(){
            if(leaving) return;
            leaving = true;
            document.body.style.animation = "fadeOut 0.9s ease forwards";
            setTimeout(()=>{
                location.href="menu.html";
            },800);
        }
        // 点击弹窗空白关闭大图
        document.getElementById("imgModal").onclick = function(e){
            if(e.target === this) closeModal();
        }
    </script>
</body>
</html>
