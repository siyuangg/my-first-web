<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>菜单</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        @keyframes fadeIn { to { opacity:1; } }
        @keyframes fadeOut {
            from { opacity:1; }
            to { opacity:0; }
        }
        @keyframes bgFlash {
            0% { background-position:0% 50%; }
            50% { background-position:100% 50%; }
            100% { background-position:0% 50%; }
        }
        body {
            opacity: 0;
            animation: fadeIn 1.2s ease forwards, bgFlash 6s ease infinite;
            background: linear-gradient(45deg, #050005, #2b0020, #550035, #200018);
            background-size: 400% 400%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #ffbbee;
            font-family: "微软雅黑", monospace;
        }
        .container{
            text-align:center;
        }
        h1{
            font-size:42px;
            margin-bottom:40px;
        }
        .btn-wrap{
            display:grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap:22px;
        }
        .menu-btn {
            padding:16px 24px;
            font-size:19px;
            border:1px solid #ff77cc;
            background:#220022;
            color:#ffbbee;
            cursor:pointer;
            transition:0.3s;
        }
        .menu-btn:hover {
            background:#ff1177;
            box-shadow:0 0 20px #ff2299;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>选择场景</h1>
        <div class="btn-wrap">
            <button class="menu-btn" onclick="goPage('dance.html')">霓虹舞厅</button>
           <button class="menu-btn" onclick="goPage('star.html')">星空露台</button>
            <button class="menu-btn" onclick="goPage('video.html')">复古录像厅</button>
           <button class="menu-btn" onclick="goPage('dream.html')">梦境回廊</button>
            <button class="menu-btn">秘密房间</button>
            <button class="menu-btn">海边晚风</button>
        </div>
    </div>
    <script>
        function goPage(url){
            document.body.style.animation = "fadeOut 0.9s ease forwards";
            setTimeout(()=>{
                location.href=url;
            },800);
        }
    </script>
</body>
</html>
