<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>复古录像厅</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        @keyframes fadeIn { to { opacity:1; } }
        @keyframes fadeOut {
            from { opacity:1; }
            to { opacity:0; }
        }
        @keyframes scan {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }
        body {
            opacity: 0;
            animation: fadeIn 1.2s ease forwards;
            background: #1a1210;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #ffddbb;
            font-family: "微软雅黑", monospace;
            position: relative;
            overflow: hidden;
        }
        .scan-line{
            position:absolute;
            width:100%;
            height:4px;
            background:rgba(255,200,150,0.15);
            animation: scan 4s linear infinite;
        }
        .box {
            text-align:center;
            z-index:2;
        }
        h1 {
            font-size:48px;
            margin-bottom:40px;
            text-shadow: 0 0 10px #cc7744;
        }
        .back-btn {
            padding:14px 30px;
            font-size:20px;
            border:1px solid #dd9966;
            background:#332218;
            color:#ffddbb;
            cursor:pointer;
            transition:0.3s;
        }
        .back-btn:hover {
            background:#773f22;
            box-shadow:0 0 20px #cc7744;
        }
    </style>
</head>
<body>
    <div class="scan-line"></div>
    <div class="box">
        <h1>📼 复古录像厅</h1>
        <button class="back-btn" onclick="goBack()">返回菜单</button>
    </div>
    <script>
        function goBack(){
            document.body.style.animation = "fadeOut 0.9s ease forwards";
            setTimeout(()=>{
                location.href="menu.html";
            },800);
        }
    </script>
</body>
</html>
