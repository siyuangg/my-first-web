<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>复古霓虹欢迎页</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  width:100vw;
  height:100vh;
  background:#550044;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  font-family:"Microsoft Yahei",sans-serif;
  position:relative;
}
/* 流沙容器，放在方框区域 */
.sand-container{
  position:absolute;
  width:700px;
  height:320px;
  pointer-events:none;
  z-index:11;
}
.sand{
  position:absolute;
  width:4px;
  height:4px;
  background:#ff99dd;
  border-radius:50%;
  box-shadow: 0 0 6px #ff66cc;
}
/* 四角闪烁星星 */
.corner-star{
  position:absolute;
  color:#ffbbee;
  font-size:24px;
  filter:drop-shadow(0 0 8px #ff44bb);
  animation: blink 2.5s ease-in-out infinite;
}
.star-tl{top:12%;left:12%;animation-delay:0s;}
.star-tr{top:12%;right:12%;animation-delay:0.7s;}
.star-bl{bottom:12%;left:12%;animation-delay:1.3s;}
.star-br{bottom:12%;right:12%;animation-delay:1.9s;}

@keyframes blink{
  0%,100%{opacity:0.2;transform:scale(0.8);}
  50%{opacity:1;transform:scale(1.2);}
}

/* 中间霓虹盒子，和你截图保持一致 */
.wrap{
  width:700px;
  padding:60px 40px;
  background:#440036;
  border:2px solid #ff33aa;
  border-radius:12px;
  text-align:center;
  box-shadow: 0 0 25px #ff33aa, 0 0 45px #ff229977;
  z-index:10;
}
.wrap h1{
  font-size:34px;
  color:#ffccee;
  margin-bottom:20px;
  font-weight:normal;
}
.wrap p{
  font-size:22px;
  color:#ffccee;
  margin:8px 0;
  opacity:0.85;
}
.enter-btn{
  margin-top:36px;
  padding:16px 50px;
  font-size:42px;
  font-weight:bold;
  border:none;
  background:#ff1188;
  color:#ffddf5;
  border-radius:6px;
  box-shadow:0 0 15px #ff2299;
  cursor:pointer;
  transition:0.3s ease;
  text-shadow:0 0 10px #ff44bb;
}
.enter-btn:hover{
  background:#ff33aa;
  box-shadow:0 0 25px #ff44bb;
}
</style>
</head>
<body>
<div class="corner-star star-tl">✦</div>
<div class="corner-star star-tr">✦</div>
<div class="corner-star star-bl">✦</div>
<div class="corner-star star-br">✦</div>

<div class="sand-container"></div>

<div class="wrap">
  <h1>欢迎来到复古霓虹世界</h1>
  <p>充满迷幻、美艳与怀旧的气息</p>
  <button class="enter-btn" onclick="location.href='menu.html'">✨ 欢迎宿主进入 ✨</button>
</div>

<script>
// 身份判断：没有设置名字密码就跳转到start.html
let hostName = localStorage.getItem("hostName");
let hostPwd = localStorage.getItem("hostPwd");
if(!hostName || !hostPwd){
  location.href = "start.html";
}

const container = document.querySelector('.sand-container');
// 流沙：从方框四条边框持续生成，向下流动
function createSand(){
  const s = document.createElement('div');
  s.className = 'sand';
  // 四条边随机选一条作为发射起点
  const side = Math.floor(Math.random() * 4);
  let x,y;
  const w = 700;
  const h = 320;
  switch(side){
    case 0: // 上边
      x = Math.random() * w;
      y = 0;
      break;
    case 1: // 右边
      x = w;
      y = Math.random() * h;
      break;
    case 2: // 下边
      x = Math.random() * w;
      y = h;
      break;
    case 3: // 左边
      x = 0;
      y = Math.random() * h;
      break;
  }
  s.style.left = x + 'px';
  s.style.top = y + 'px';
  container.appendChild(s);

  // 向下流动，带一点点横向偏移，模拟流沙散落
  const speedY = 1.5 + Math.random() * 2.2;
  const driftX = (Math.random()-0.5)*0.8;
  let ty = y;
  let tx = x;
  function fall(){
    ty += speedY;
    tx += driftX;
    s.style.top = ty + 'px';
    s.style.left = tx + 'px';
    // 流出容器底部就删除
    if(ty > h){
      s.remove();
    }else{
      requestAnimationFrame(fall);
    }
  }
  fall();
}
// 源源不断生成流沙粒子
function loopSand(){
  createSand();
  setTimeout(loopSand, 25 + Math.random()*40);
}
loopSand();
</script>
</body>
</html>
