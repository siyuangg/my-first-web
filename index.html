<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>复古霓虹欢迎页</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  width:100vw;
  height:100vh;
  background:#550044;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  font-family:"Microsoft Yahei",sans-serif;
  position:relative;
}
/* 流星容器 */
.star-field{
  position:absolute;
  inset:0;
  pointer-events:none;
}
.meteor{
  position:absolute;
  width:80px;
  height:2px;
  background:linear-gradient(90deg,#ff88dd,transparent);
  border-radius:99px;
  opacity:0;
  filter:drop-shadow(0 0 6px #ff44bb);
}
/* 四角闪烁星星 */
.corner-star{
  position:absolute;
  color:#ffbbee;
  font-size:24px;
  filter:drop-shadow(0 0 8px #ff44bb);
  animation: blink 2.5s ease-in-out infinite;
}
.star-tl{top:12%;left:12%;animation-delay:0s;}
.star-tr{top:12%;right:12%;animation-delay:0.7s;}
.star-bl{bottom:12%;left:12%;animation-delay:1.3s;}
.star-br{bottom:12%;right:12%;animation-delay:1.9s;}

@keyframes blink{
  0%,100%{opacity:0.2;transform:scale(0.8);}
  50%{opacity:1;transform:scale(1.2);}
}

/* 中间霓虹盒子 */
.wrap{
  width:700px;
  padding:60px 40px;
  background:#440036;
  border:2px solid #ff33aa;
  border-radius:12px;
  text-align:center;
  box-shadow: 0 0 25px #ff33aa, 0 0 45px #ff229977;
  z-index:10;
}
.wrap h1{
  font-size:34px;
  color:#ffccee;
  margin-bottom:20px;
  font-weight:normal;
}
.wrap p{
  font-size:22px;
  color:#ffccee;
  margin:8px 0;
  opacity:0.85;
}
.enter-btn{
  margin-top:36px;
  padding:16px 50px;
  font-size:42px;
  font-weight:bold;
  border:none;
  background:#ff1188;
  color:#ffddf5;
  border-radius:6px;
  box-shadow:0 0 15px #ff2299;
  cursor:pointer;
  transition:0.3s ease;
  text-shadow:0 0 10px #ff44bb;
}
.enter-btn:hover{
  background:#ff33aa;
  box-shadow:0 0 25px #ff44bb;
}
</style>
</head>
<body>
<div class="star-field">
  <div class="corner-star star-tl">✦</div>
  <div class="corner-star star-tr">✦</div>
  <div class="corner-star star-bl">✦</div>
  <div class="corner-star star-br">✦</div>
</div>

<div class="wrap">
  <h1>欢迎来到复古霓虹世界</h1>
  <p>充满迷幻、美艳与怀旧的气息</p>
  <button class="enter-btn" onclick="location.href='menu.html'">✨ 欢迎宿主进入 ✨</button>
</div>

<script>
const field = document.querySelector('.star-field');
function createMeteor(){
  const m = document.createElement('div');
  m.className = 'meteor';
  const side = Math.floor(Math.random()*4);
  let startX,startY,endX,endY;
  const w = window.innerWidth;
  const h = window.innerHeight;
  switch(side){
    case 0:
      startX = 0; startY = 0;
      endX = w*0.35; endY = h*0.35;
      break;
    case 1:
      startX = w; startY = 0;
      endX = w*0.65; endY = h*0.35;
      break;
    case 2:
      startX = 0; startY = h;
      endX = w*0.35; endY = h*0.65;
      break;
    case 3:
      startX = w; startY = h;
      endX = w*0.65; endY = h*0.65;
      break;
  }
  m.style.left = startX+'px';
  m.style.top = startY+'px';
  field.appendChild(m);

  m.animate([
    {opacity:0, transform:'translate(0,0)'},
    {opacity:1},
    {opacity:0, transform:`translate(${endX-startX}px,${endY-startY}px)`}
  ],{
    duration: 1200 + Math.random()*1200,
    easing:'linear'
  })
  setTimeout(()=>m.remove(),2500);
}
function loopMeteor(){
  createMeteor();
  setTimeout(loopMeteor, 1000 + Math.random()*3000);
}
loopMeteor();
</script>
</body>
</html>
