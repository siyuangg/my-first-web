<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>RETRO 90s</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: default;
        }

        /* 90年代复古美艳主背景 */
        body {
            background: linear-gradient(45deg, #000, #2e002e, #4a0038, #6a004a);
            background-size: 400% 400%;
            animation: bgShift 12s ease infinite;
            color: #ff99ff;
            font-family: "微软雅黑", monospace;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 背景缓慢动效 */
        @keyframes bgShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 复古容器边框 */
        .retro-box {
            width: 90%;
            max-width: 800px;
            margin: 60px auto;
            padding: 30px;
            border: 4px double #ff33cc;
            background: #00000088;
            box-shadow: 0 0 25px #ff33cc, 0 0 45px #ff00ff;
        }

        /* 标题闪烁效果 */
        .neon-title {
            text-align: center;
            font-size: 42px;
            color: #ff33cc;
            text-shadow: 0 0 5px #ff33cc, 0 0 15px #ff00ff, 0 0 25px #ff66ff;
            margin: 20px 0;
            animation: blink 1.8s infinite alternate;
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        /* 复古文字 */
        .retro-text {
            font-size: 18px;
            line-height: 1.8;
            text-align: center;
            margin: 20px 0;
            color: #ffccff;
        }

        /* 90年代按钮 */
        .retro-btn {
            display: block;
            width: 220px;
            margin: 30px auto;
            padding: 12px;
            background: #ff0066;
            color: white;
            font-size: 16px;
            border: 2px solid #ff99cc;
            box-shadow: 0 0 10px #ff3399;
            transition: 0.3s;
            text-align: center;
        }

        .retro-btn:hover {
            background: #ff3399;
            transform: scale(1.08);
            box-shadow: 0 0 20px #ff33cc;
        }

        /* 鼠标爱心效果 */
        .heart {
            position: fixed;
            pointer-events: none;
            animation: heartFly 1.5s linear forwards;
            color: #ff33cc;
            font-size: 18px;
        }

        @keyframes heartFly {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-80px); }
        }
    </style>
</head>

<body>
    <div class="retro-box">
        <h1 class="neon-title" id="typeTitle">✨ 1990S 复古美艳空间 ✨</h1>
        <p class="retro-text">欢迎来到复古霓虹世界<br>充满迷幻、美艳与怀旧的气息</p>
        <p class="retro-text">鼠标移动会掉落爱心 ❤️<br>点击按钮触发特效</p>
        <button class="retro-btn" onclick="showMessage()">点击进入复古世界</button>
    </div>

    <script>
        // 打字机效果
        const title = document.getElementById("typeTitle");
        const text = "✨ 1990S 复古美艳空间 ✨";
        let index = 0;

        function typeWriter() {
            if (index < text.length) {
                title.innerHTML += text.charAt(index);
                index++;
                setTimeout(typeWriter, 120);
            }
        }
        window.onload = typeWriter;

        // 鼠标移动掉落爱心
        document.addEventListener("mousemove", function(e) {
            const heart = document.createElement("div");
            heart.className = "heart";
            heart.innerHTML = "❤";
            heart.style.left = e.pageX + "px";
            heart.style.top = e.pageY + "px";
            document.body.appendChild(heart);

            setTimeout(() => heart.remove(), 1400);
        });

        // 按钮交互
        function showMessage() {
            alert("✨ 欢迎来到90年代复古美艳世界 ✨\n霓虹闪烁 · 复古迷幻 · 美艳永恒");
        }
    </script>
</body>
</html>
