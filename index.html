<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>RETRO 90s</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: default;
        }
        @keyframes fadeIn {
            to { opacity: 1; }
        }
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }
        @keyframes bgShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes boxFade {
            to { opacity: 1; transform: translateY(0); }
        }
        body {
            opacity: 0;
            animation: fadeIn 1.2s ease forwards, bgShift 12s ease infinite;
            background: linear-gradient(45deg, #000, #2e002e, #4a0038, #6a004a);
            background-size: 400% 400%;
            color: #ff99ff;
            font-family: "微软雅黑", monospace;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .box {
            border: 2px solid #ff22aa;
            padding: 60px 80px;
            text-align: center;
            box-shadow:
                0 0 10px #ff22aa,
                0 0 20px #ff22aa,
                0 0 40px #ff22aa,
                inset 0 0 15px #ff2266;
            border-radius: 4px;
            opacity: 0;
            transform: translateY(20px);
            animation: boxFade 1.5s 0.5s ease forwards;
        }
        .title {
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow:
                0 0 6px #ff44bb,
                0 0 12px #ff44bb,
                0 0 24px #ff2299;
            animation: neonBlink 2.2s ease-in-out infinite alternate;
        }
        @keyframes neonBlink {
            0% {
                text-shadow:
                    0 0 6px #ff44bb,
                    0 0 12px #ff44bb,
                    0 0 24px #ff2299;
            }
            100% {
                text-shadow:
                    0 0 2px #ff44bb,
                    0 0 6px #ff44bb,
                    0 0 12px #ff2299;
            }
        }
        .desc {
            font-size: 20px;
            line-height: 1.8;
            margin-bottom: 35px;
            color: #ffbbee;
        }
        .neon-btn {
            font-size: 22px;
            padding: 14px 36px;
            border: 2px solid #ff1199;
            background: #ff1188;
            color: #fff;
            cursor: pointer;
            border-radius: 3px;
            box-shadow:
                0 0 8px #ff1199,
                0 0 18px #ff1188;
            transition: all 0.3s;
        }
        .neon-btn:hover {
            background: #ff33aa;
            box-shadow:
                0 0 12px #ff1199,
                0 0 30px #ff2299,
                0 0 50px #ff1177;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1 class="title" id="title"></h1>
        <div class="desc">
            欢迎来到复古霓虹世界<br>
            充满迷幻、美艳与怀旧的气息
        </div>
        <button class="neon-btn" onclick="goMenu()">欢迎进入我的世界</button>
    </div>

    <script>
        const title = document.getElementById("title");
        const text = "✨ 欢迎宿主进入 ✨";
        let index = 0;

        function typeWriter() {
            if (index < text.length) {
                title.innerHTML += text.charAt(index);
                index++;
                setTimeout(typeWriter, 120);
            }
        }
        window.onload = typeWriter;

        function goMenu() {
            document.body.style.animation = "fadeOut 0.9s ease forwards";
            setTimeout(()=>{
                location.href = "menu.html";
            },800);
        }
    </script>
</body>
</html>
