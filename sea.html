<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>宿主</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        @keyframes fadeIn { to { opacity:1; } }
        @keyframes fadeOut {
            from { opacity:1; }
            to { opacity:0; }
        }
        @keyframes filament {
            0%,100% { transform: translateY(-6px) scale(0.95); opacity:0.25; }
            50% { transform: translateY(6px) scale(1.05); opacity:0.45; }
        }
        @keyframes breathe {
            0%,100% { box-shadow: 0 0 8px #3b1b54; }
            50% { box-shadow: 0 0 18px #512875; }
        }
        body {
            opacity: 0;
            animation: fadeIn 1.2s ease forwards;
            background: #07070b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #a794bb;
            font-family: "微软雅黑", monospace;
            position: relative;
            overflow-x: hidden;
            padding: 20px;
        }
        .filament{
            position:absolute;
            font-size:20px;
            animation: filament 6s ease-in-out infinite;
            z-index: 1;
            pointer-events: none;
        }
        .wrap {
            text-align:center;
            z-index:2;
            width:100%;
            max-width:700px;
        }
        h1 {
            font-size:42px;
            margin-bottom:8px;
            color:#c3aed6;
            text-shadow: 0 0 10px #4b256b;
        }
        .sub-title{
            margin-bottom:24px;
            color:#847099;
        }
        .card{
            background:#0c0a14;
            border:1px solid #3b1b54;
            border-radius:12px;
            padding:20px;
            margin-bottom:16px;
            text-align:left;
            animation: breathe 5s ease-in-out infinite;
        }
        .card-title{
            font-size:18px;
            margin-bottom:12px;
            color:#b8a1d1;
        }
        input,textarea{
            width:100%;
            padding:10px;
            margin:6px 0;
            background:#050409;
            border:1px solid #301846;
            color:#b09cc4;
            border-radius:6px;
        }
        textarea{
            min-height:100px;
            resize:vertical;
        }
        .btn-row{
            display:flex;
            gap:10px;
            flex-wrap:wrap;
            margin-top:10px;
            align-items:center;
        }
        button{
            padding:10px 16px;
            border:1px solid #4b256b;
            background:#0c0a14;
            color:#b09cc4;
            cursor:pointer;
            transition:0.3s;
            border-radius:6px;
        }
        button:hover {
            background:#271438;
            box-shadow:0 0 12px #4b256b;
        }
        .lyric-box {
            height:220px;
            padding:15px;
            background:#050409;
            border-radius:8px;
            border:1px solid #301846;
            overflow-y:auto;
            text-align:center;
            font-size:20px;
            line-height:2.4;
        }
        .lyric-line{
            transition:0.25s;
            opacity:0.35;
        }
        .lyric-line.active{
            color:#d4c1e8;
            opacity:1;
            text-shadow:0 0 6px #7749a0;
        }
        .song-list{
            max-height:160px;
            overflow-y:auto;
            margin-top:8px;
        }
        .song-item{
            padding:8px 10px;
            border-bottom:1px solid #221231;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }
        .song-item .del{
            padding:4px 8px;
            font-size:12px;
        }
        .song-item .name-text{
            cursor:pointer;
        }
        .vol-wrap{
            display:flex;
            align-items:center;
            gap:8px;
            margin-top:8px;
        }
        #volSlider{
            flex:1;
        }
        .back-btn {
            width:100%;
            padding:14px;
            font-size:18px;
            margin-top:8px;
        }
        .note-item{
            padding:10px;
            margin:8px 0;
            border:1px solid #2a153d;
            border-radius:6px;
            background:#07050c;
            position:relative;
        }
        .note-del{
            position:absolute;
            right:8px;
            top:6px;
            font-size:12px;
            padding:2px 6px;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>🧬 宿主</h1>
        <div class="sub-title">躯体为宿主，意识在此寄居</div>

        <div class="card">
            <div class="card-title">🎵 意识音轨</div>
            <input id="songName" placeholder="曲目名称">
            <input id="songSrc" placeholder="MP3直链">
            <textarea id="songLrc" placeholder="LRC歌词（可选）"></textarea>
            <div class="btn-row">
                <button onclick="addSong()">加入歌单</button>
                <button onclick="fullScreenLyric()">全屏查看歌词</button>
                <button onclick="lyricFontBigger()">字号+</button>
                <button onclick="lyricFontSmaller()">字号-</button>
            </div>
            <div class="btn-row">
                <button onclick="exportList()">导出歌单</button>
                <button onclick="importList()">导入歌单</button>
            </div>
        </div>

        <div class="card">
            <div class="card-title" id="nowName">当前：暂无音轨</div>
            <audio id="audio" controls>
            <div class="vol-wrap">
                <span>音量</span>
                <input type="range" id="volSlider" min="0" max="1" step="0.01" value="0.8">
            </div>
            <div class="btn-row">
                <button onclick="prevSong()">上一首</button>
                <button onclick="nextSong()">下一首</button>
                <button id="modeBtn" onclick="changePlayMode()">模式：顺序循环</button>
            </div>
        </div>

        <div class="card">
            <div class="card-title">🎤 歌词</div>
            <div class="lyric-box" id="lyricWrap"></div>
        </div>

        <div class="card">
            <div class="card-title">📜 寄生独白</div>
            <textarea id="noteInput" placeholder="写下难以言说的思绪，寄存于此……"></textarea>
            <button onclick="addNote()">寄存独白</button>
            <div id="noteBox"></div>
        </div>

        <div class="card">
            <div class="card-title">📜 音轨列表</div>
            <div class="song-list" id="songListDom"></div>
        </div>

        <button class="back-btn" onclick="goBack()">返回菜单</button>
    </div>

    <script>
        //丝状粒子
        const filamentChar = ['≋','⸗','⸙'];
        for(let i=0;i<12;i++){
            let el = document.createElement('div');
            el.className="filament";
            el.innerText = filamentChar[Math.floor(Math.random()*filamentChar.length)];
            el.style.left = Math.random()*90 + "%";
            el.style.top = Math.random()*85 + "%";
            el.style.animationDelay = Math.random()*3 + "s";
            document.body.appendChild(el);
        }

        const audio = document.getElementById('audio');
        const lyricWrap = document.getElementById('lyricWrap');
        const songListDom = document.getElementById('songListDom');
        const nowNameDom = document.getElementById('nowName');
        const volSlider = document.getElementById('volSlider');
        const modeBtn = document.getElementById('modeBtn');
        const noteBox = document.getElementById('noteBox');
        const noteInput = document.getElementById('noteInput');

        let songList = JSON.parse(localStorage.getItem('hostSongList')) || [];
        let noteList = JSON.parse(localStorage.getItem('hostNoteList')) || [];
        let currentIndex = 0;
        let lyricArr = [];
        let playMode = 0; //0顺序 1单曲 2随机
        let lyricFontSize = 20;

        volSlider.oninput = ()=>{ audio.volume = volSlider.value; }
        audio.volume = volSlider.value;

        function renderList(){
            songListDom.innerHTML = '';
            songList.forEach((item,idx)=>{
                const div = document.createElement('div');
                div.className = 'song-item';
                div.innerHTML = `
                    <span class="name-text">${item.name}</span>
                    <button class="del">删除</button>
                `;
                div.querySelector('.name-text').onclick = ()=>playByIndex(idx);
                div.querySelector('.del').onclick = (e)=>{
                    e.stopPropagation();
                    songList.splice(idx,1);
                    saveList();
                    renderList();
                }
                songListDom.appendChild(div);
            })
        }
        function saveList(){
            localStorage.setItem('hostSongList', JSON.stringify(songList));
        }

        function addSong(){
            const name = document.getElementById('songName').value.trim();
            const src = document.getElementById('songSrc').value.trim();
            const lrc = document.getElementById('songLrc').value.trim();
            if(!name || !src){ alert("曲目名称和音频链接不能为空"); return; }
            songList.push({name,src,lrc});
            saveList();
            renderList();
            alert("音轨寄存成功");
        }

        function parseLrc(text){
            const res=[];
            text.split('\n').forEach(line=>{
                const m = line.match(/\[(\d{2}):(\d{2})\.?(\d{0,2})\](.*)/);
                if(m){
                    const t = Number(m[1])*60 + Number(m[2]) + Number(m[3]||0)/100;
                    res.push({time:t, text:m[4].trim()});
                }
            })
            return res.sort((a,b)=>a.time-b.time);
        }

        function playByIndex(idx){
            currentIndex=idx;
            const s = songList[idx];
            nowNameDom.innerText="当前："+s.name;
            audio.src=s.src;
            lyricArr=parseLrc(s.lrc);
            renderLyric();
            audio.play().catch(()=>{});
        }

        function renderLyric(){
            lyricWrap.innerHTML='';
            lyricWrap.style.fontSize=lyricFontSize+'px';
            lyricArr.forEach((it,i)=>{
                const p=document.createElement('div');
                p.className='lyric-line';
                p.dataset.idx=i;
                p.innerText=it.text;
                lyricWrap.appendChild(p);
            })
        }

        audio.ontimeupdate=()=>{
            const t=audio.currentTime;
            let ac=-1;
            for(let i=0;i<lyricArr.length;i++){
                if(lyricArr[i].time<=t) ac=i;
                else break;
            }
            document.querySelectorAll('.lyric-line').forEach((el,i)=>{
                el.classList.toggle('active', i==ac);
                if(i==ac) el.scrollIntoView({behavior:'smooth',block:'center'});
            })
        }

        function nextSong(){
            if(songList.length===0) return;
            if(playMode===1){playByIndex(currentIndex);return;}
            if(playMode===2){
                currentIndex=Math.floor(Math.random()*songList.length);
            }else{
                currentIndex=(currentIndex+1)%songList.length;
            }
            playByIndex(currentIndex);
        }
        function prevSong(){
            if(songList.length===0) return;
            if(playMode===1){playByIndex(currentIndex);return;}
            if(playMode===2){
                currentIndex=Math.floor(Math.random()*songList.length);
            }else{
                currentIndex=(currentIndex-1+songList.length)%songList.length;
            }
            playByIndex(currentIndex);
        }
        audio.onended=nextSong;

        function changePlayMode(){
            playMode=(playMode+1)%3;
            const arr=['顺序循环','单曲循环','随机播放'];
            modeBtn.innerText="模式："+arr[playMode];
        }

        function fullScreenLyric(){
            lyricWrap.requestFullscreen?.();
        }
        function lyricFontBigger(){lyricFontSize+=2;lyricWrap.style.fontSize=lyricFontSize+'px';}
        function lyricFontSmaller(){lyricFontSize=Math.max(12,lyricWrap.style.fontSize=lyricFontSize+'px');}

        function exportList(){
            const str=JSON.stringify(songList,null,2);
            navigator.clipboard.writeText(str).then(()=>alert("歌单已复制，可以保存"));
        }
        function importList(){
            const p=prompt("粘贴导出的歌单文本：");
            if(!p)return;
            try{
                const arr=JSON.parse(p);
                if(Array.isArray(arr)){
                    songList=arr;
                    saveList();
                    renderList();
                    alert("导入成功");
                }
            }catch(e){alert("解析失败，文本格式不对")}
        }

        //独白留言
        function renderNote(){
            noteBox.innerHTML="";
            noteList.forEach((item,i)=>{
                const div=document.createElement("div");
                div.className="note-item";
                div.innerHTML = `
                    ${item}
                    <button class="note-del" onclick="delNote(${i})">移除</button>
                `;
                noteBox.appendChild(div);
            })
        }
        function addNote(){
            const text = noteInput.value.trim();
            if(!text) return;
            noteList.push(text);
            localStorage.setItem('hostNoteList',JSON.stringify(noteList));
            renderNote();
            noteInput.value="";
        }
        function delNote(i){
            noteList.splice(i,1);
            localStorage.setItem('hostNoteList',JSON.stringify(noteList));
            renderNote();
        }

        function goBack(){
            document.body.style.animation = "fadeOut 0.9s ease forwards";
            setTimeout(()=>{
                location.href="menu.html";
            },800);
        }

        renderList();
        renderNote();
    </script>
</body>
</html>
