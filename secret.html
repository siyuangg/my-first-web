<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>秘密空间</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#440036;
  font-family:"Microsoft Yahei",sans-serif;
  color:#ffddf5;
  padding:20px;
  position:relative;
  min-height:100vh;
}

/* 霓虹星空背景（和menu/index完全统一） */
.star-field{
  position:fixed;inset:0;pointer-events:none;z-index:1;
}
.meteor{
  position:absolute;
  width:80px;
  height:2px;
  background:linear-gradient(90deg,#ff88dd,transparent);
  border-radius:99px;
  opacity:0;
  filter:drop-shadow(0 0 6px #ff44bb);
}
.corner-star{
  position:absolute;
  color:#ffbbee;
  font-size:26px;
  filter:drop-shadow(0 0 8px #ff44bb);
  animation: blink 2.2s infinite;
}
.star-tl{top:10%;left:10%;}
.star-tr{top:10%;right:10%;animation-delay:0.6s;}
.star-bl{bottom:10%;left:10%;animation-delay:1.1s;}
.star-br{bottom:10%;right:10%;animation-delay:1.7s;}
@keyframes blink {
  0%,100%{opacity:0.35}
  50%{opacity:1}
}

.wrap{
  position:relative;
  z-index:2;
  max-width:720px;
  margin:0 auto;
}
.card{
  border:1px solid #ff44bb;
  box-shadow:0 0 14px #ff448877;
  border-radius:16px;
  background:#35002a;
  padding:24px;
  margin-top:30px;
}
.date-text{
  font-size:22px;
  margin-bottom:16px;
}
.tab-row{
  display:flex;
  gap:8px;
  margin-bottom:14px;
}
.tab-btn{
  padding:6px 14px;
  border:1px solid #ff44bb;
  background:#440036;
  color:#ffddf5;
  border-radius:8px;
  cursor:pointer;
  transition:0.25s;
}
.tab-btn:hover{
  background:#77005c;
  box-shadow:0 0 8px #ff44bb88;
}
.panel{
  display:none;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:16px;
}
.panel.active{
  display:flex;
}
.emoji-item, .kaomoji-item{
  font-size:24px;
  padding:4px 6px;
  cursor:pointer;
  border-radius:6px;
  transition:0.2s;
}
.emoji-item:hover, .kaomoji-item:hover{
  background:#5a0046;
}
textarea{
  width:100%;
  min-height:220px;
  background:#2b0022;
  border:1px solid #ff44bb;
  border-radius:12px;
  padding:14px;
  color:#ffddf5;
  font-size:16px;
  outline:none;
}
.btn-row{
  display:flex;
  gap:12px;
  margin-top:20px;
}
.save-btn{
  flex:1;
  padding:14px;
  border:none;
  background:#ff2299;
  color:white;
  border-radius:12px;
  font-size:17px;
  cursor:pointer;
}
.back-btn{
  flex:1;
  padding:14px;
  border:1px solid #ff44bb;
  background:#35002a;
  color:#ffddf5;
  border-radius:12px;
  font-size:17px;
  cursor:pointer;
}
</style>
</head>
<body>
<div class="star-field">
  <div class="corner-star star-tl">✦</div>
  <div class="corner-star star-tr">✦</div>
  <div class="corner-star star-bl">✦</div>
  <div class="corner-star star-br">✦</div>
</div>
<div class="wrap">
  <div class="card">
    <div class="date-text">📅 2026-10-15</div>
    <div class="tab-row">
      <button class="tab-btn" onclick="switchTab('emoji')">表情</button>
      <button class="tab-btn" onclick="switchTab('kaomoji')">颜文字</button>
      <button class="tab-btn" onclick="switchTab('sticker')">贴图</button>
      <button class="tab-btn" onclick="switchTab('cut')">抠图</button>
    </div>

    <!-- 表情面板 -->
    <div id="emojiPanel" class="panel active">
      <span class="emoji-item" onclick="insertText('😜')">😜</span>
      <span class="emoji-item" onclick="insertText('😊')">😊</span>
      <span class="emoji-item" onclick="insertText('😳')">😳</span>
      <span class="emoji-item" onclick="insertText('😡')">😡</span>
      <span class="emoji-item" onclick="insertText('😱')">😱</span>
      <span class="emoji-item" onclick="insertText('😐')">😐</span>
      <span class="emoji-item" onclick="insertText('🥰')">🥰</span>
      <span class="emoji-item" onclick="insertText('😎')">😎</span>
      <span class="emoji-item" onclick="insertText('🥳')">🥳</span>
      <span class="emoji-item" onclick="insertText('😭')">😭</span>
      <span class="emoji-item" onclick="insertText('🥺')">🥺</span>
      <span class="emoji-item" onclick="insertText('😢')">😢</span>
      <span class="emoji-item" onclick="insertText('🤔')">🤔</span>
      <span class="emoji-item" onclick="insertText('🫂')">🫂</span>
      <span class="emoji-item" onclick="insertText('✨')">✨</span>
      <span class="emoji-item" onclick="insertText('💖')">💖</span>
      <span class="emoji-item" onclick="insertText('🧡')">🧡</span>
      <span class="emoji-item" onclick="insertText('💛')">💛</span>
      <span class="emoji-item" onclick="insertText('💚')">💚</span>
      <span class="emoji-item" onclick="insertText('💙')">💙</span>
      <span class="emoji-item" onclick="insertText('💜')">💜</span>
      <span class="emoji-item" onclick="insertText('🌸')">🌸</span>
      <span class="emoji-item" onclick="insertText('🌼')">🌼</span>
      <span class="emoji-item" onclick="insertText('⭐')">⭐</span>
      <span class="emoji-item" onclick="insertText('🌙')">🌙</span>
      <span class="emoji-item" onclick="insertText('🍓')">🍓</span>
      <span class="emoji-item" onclick="insertText('☕')">☕</span>
      <span class="emoji-item" onclick="insertText('🐶')">🐶</span>
      <span class="emoji-item" onclick="insertText('🐱')">🐱</span>
      <span class="emoji-item" onclick="insertText('🎵')">🎵</span>
      <span class="emoji-item" onclick="insertText('💡')">💡</span>
      <span class="emoji-item" onclick="insertText('🦋')">🦋</span>
      <span class="emoji-item" onclick="insertText('🍰')">🍰</span>
      <span class="emoji-item" onclick="insertText('☁️')">☁️</span>
      <span class="emoji-item" onclick="insertText('🌷')">🌷</span>
      <span class="emoji-item" onclick="insertText('🪐')">🪐</span>
    </div>

    <!-- 颜文字面板 -->
    <div id="kaomojiPanel" class="panel">
      <span class="kaomoji-item" onclick="insertText('(๑>ᴗ<๑)')">(๑>ᴗ<๑)</span>
      <span class="kaomoji-item" onclick="insertText('(≧∇≦)ﾉ')">(≧∇≦)ﾉ</span>
      <span class="kaomoji-item" onclick="insertText('(｡•́ω•̀｡)')">(｡•́ω•̀｡)</span>
      <span class="kaomoji-item" onclick="insertText('( ´･ω･` )')">( ´･ω･` )</span>
      <span class="kaomoji-item" onclick="insertText('(๑•̀ㅂ•́)و✧')">(๑•̀ㅂ•́)و✧</span>
      <span class="kaomoji-item" onclick="insertText('(╥﹏╥)')">(╥﹏╥)</span>
      <span class="kaomoji-item" onclick="insertText('(´▽`ʃ♡ƪ)')">(´▽`ʃ♡ƪ)</span>
      <span class="kaomoji-item" onclick="insertText('(✧∇✧)')">(✧∇✧)</span>
      <span class="kaomoji-item" onclick="insertText('(๑•́ω•̀๑)')">(๑•́ω•̀๑)</span>
      <span class="kaomoji-item" onclick="insertText('(｡>﹏<｡)')">(｡>﹏<｡)</span>
      <span class="kaomoji-item" onclick="insertText('(◍•ᴗ•◍)')">(◍•ᴗ•◍)</span>

      <span class="kaomoji-item" onclick="insertText('(´;ω;`)')">(´;ω;`)</span>
      <span class="kaomoji-item" onclick="insertText('(ノ´ヮ`)ノ')">(ノ´ヮ`)ノ</span>
      <span class="kaomoji-item" onclick="insertText('(≧∀≦)')">(≧∀≦)</span>
      <span class="kaomoji-item" onclick="insertText('( • ̀ω•́ )✧')">( • ̀ω•́ )✧</span>
    </div>

    <!-- 贴图占位 -->
    <div id="stickerPanel" class="panel">
      <span style="padding:8px;">贴图功能区域</span>
    </div>
    <!-- 抠图占位 -->
    <div id="cutPanel" class="panel">
      <span style="padding:8px;">抠图功能区域</span>
    </div>

    <textarea id="diaryInput" placeholder="开始写今天的心情吧..."></textarea>
    <div class="btn-row">
      <button class="save-btn">💾 保存</button>
      <button class="back-btn">↩ 返回</button>
    </div>
  </div>
</div>

<script>
const inputEl = document.getElementById('diaryInput');
//切换标签
function switchTab(type){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'))
  if(type === 'emoji') document.getElementById('emojiPanel').classList.add('active')
  if(type === 'kaomoji') document.getElementById('kaomojiPanel').classList.add('active')
  if(type === 'sticker') document.getElementById('stickerPanel').classList.add('active')
  if(type === 'cut') document.getElementById('cutPanel').classList.add('active')
}
// 在光标位置插入表情/颜文字，不会直接加到末尾
function insertText(str){
  const start = inputEl.selectionStart;
  const end = inputEl.selectionEnd;
  const origin = inputEl.value;
  inputEl.value = origin.substring(0, start)+str+origin.substring(end);
  inputEl.selectionStart = inputEl.selectionEnd = start + str.length;
  inputEl.focus();
}
</script>
</body>
</html>
