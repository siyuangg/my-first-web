<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>秘密房间</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        @keyframes fadeIn { to { opacity:1; } }
        @keyframes fadeOut {
            from { opacity:1; }
            to { opacity:0; }
        }
        @keyframes pulse {
            0%,100% { opacity:0.7; }
            50% { opacity:1; }
        }
        body {
            opacity: 0;
            animation: fadeIn 1.2s ease forwards;
            background: #0a0a0f;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #c0c8e0;
            font-family: "微软雅黑", monospace;
        }
        .box {
            text-align:center;
        }
        h1 {
            font-size:48px;
            margin-bottom:40px;
            text-shadow: 0 0 12px #6677aa;
            animation: pulse 2.5s infinite;
        }
        .back-btn {
            padding:14px 30px;
            font-size:20px;
            border:1px solid #7788bb;
            background:#151825;
            color:#c0c8e0;
            cursor:pointer;
            transition:0.3s;
        }
        .back-btn:hover {
            background:#303a60;
            box-shadow:0 0 20px #556699;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>🔒 秘密房间</h1>
        <button class="back-btn" onclick="goBack()">返回菜单</button>
    </div>
    <script>
        function goBack(){
            document.body.style.animation = "fadeOut 0.9s ease forwards";
            setTimeout(()=>{
                location.href="menu.html";
            },800);
        }
    </script>
</body>
</html>
