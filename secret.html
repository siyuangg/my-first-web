<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>秘密空间</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#440036;
  font-family:"Microsoft Yahei",sans-serif;
  color:#ffddf5;
  padding:20px;
  position:relative;
  min-height:100vh;
}

/* 霓虹星空背景（原样保留你的代码） */
.star-field{
  position:fixed;inset:0;pointer-events:none;z-index:1;
}
.meteor{
  position:absolute;
  width:80px;
  height:2px;
  background:linear-gradient(90deg,#ff88dd,transparent);
  border-radius:99px;
  opacity:0;
  filter:drop-shadow(0 0 6px #ff44bb);
}
.corner-star{
  position:absolute;
  color:#ffbbee;
  font-size:26px;
  filter:drop-shadow(0 0 8px #ff44bb);
  animation: blink 2.2s infinite;
}
.star-tl{top:10%;left:10%;}
.star-tr{top:10%;right:10%;animation-delay:0.6s;}
.star-bl{bottom:10%;left:10%;animation-delay:1.1s;}
.star-br{bottom:10%;right:10%;animation-delay:1.7s;}

@keyframes blink {
    0%,100%{opacity:0.35}
    50%{opacity:1}
}

/* ====== 心情日记弹窗（就是截图这个） ====== */
.diary-mask{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.55);
    z-index:99;
    display:none;
    align-items:center;
    justify-content:center;
    padding:16px;
}
.diary-box{
    background:#440036;
    border:2px solid #ff44bb;
    border-radius:18px;
    padding:24px;
    width:min(720px,100%);
    box-shadow: 0 0 18px #ff44bb55;
}
.diary-date{
    font-size:22px;
    margin-bottom:14px;
    color:#ffddf5;
    display:flex;
    align-items:center;
    gap:6px;
}
.tab-row{
    display:flex;
    gap:8px;
    margin-bottom:16px;
}
.tab-btn{
    border:1px solid #ff88dd;
    background:#580047;
    color:#ffddf5;
    padding:6px 14px;
    border-radius:8px;
    cursor:pointer;
}
.tab-btn:hover{
    background:#72005c;
}
.emoji-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:16px;
}
.emoji-item{
    font-size:24px;
    cursor:pointer;
    padding:4px;
    border-radius:6px;
}
.emoji-item:hover{
    background:#660052;
}
.diary-textarea{
    width:100%;
    min-height:220px;
    background:#35002a;
    border:1px solid #ff44bb;
    border-radius:12px;
    padding:14px;
    color:#ffddf5;
    font-size:16px;
    outline:none;
}
.btn-row-bottom{
    display:flex;
    gap:12px;
    margin-top:18px;
}
.save-btn{
    flex:1;
    padding:14px;
    border:none;
    border-radius:12px;
    background:#ff2299;
    color:white;
    font-size:17px;
    cursor:pointer;
}
.back-btn{
    flex:1;
    padding:14px;
    border:1px solid #ff44bb;
    border-radius:12px;
    background:#440036;
    color:#ffddf5;
    font-size:17px;
    cursor:pointer;
}

/* 打开日记的按钮，放在秘密空间页面上 */
.open-diary{
    position:relative;
    z-index:5;
    margin:30px auto;
    display:block;
    padding:14px 24px;
    border:1px solid #ff44bb;
    background:#580047;
    color:#ffddf5;
    border-radius:12px;
    font-size:18px;
    cursor:pointer;
}
</style>
</head>
<body>
<!-- 你的星空背景原样不动 -->
<div class="star-field">
    <div class="corner-star star-tl">✦</div>
    <div class="corner-star star-tr">✦</div>
    <div class="corner-star star-bl">✦</div>
    <div class="corner-star star-br">✦</div>
    <!-- 背景流星你后面再加也可以 -->
</div>

<button class="open-diary" onclick="openDiary()">📔 写今日心情</button>

<!-- 日记弹窗，就是截图里的 -->
<div class="diary-mask" id="diaryMask">
    <div class="diary-box">
        <div class="diary-date">🗓️ <span id="nowDate">2026-10-15</span></div>
        <div class="tab-row">
            <button class="tab-btn">表情</button>
            <button class="tab-btn">颜文字</button>
            <button class="tab-btn">贴图</button>
            <button class="tab-btn">抠图</button>
        </div>
        <div class="emoji-row" id="emojiWrap">
            <!-- 表情会由JS生成 -->
        </div>
        <textarea class="diary-textarea" id="diaryInput" placeholder="开始写今天的心情吧..."></textarea>
        <div class="btn-row-bottom">
            <button class="save-btn" onclick="saveDiary()">💾 保存</button>
            <button class="back-btn" onclick="closeDiary()">↩ 返回</button>
        </div>
    </div>
</div>

<script>
// 表情库，和截图一致
const emojiList = [
    '😋','🙂','😳','😠','😲','😯','🥰','😎','🤩','🥳','😰','😟',
    '😨','🫂','✨','💖','🧡','💛','💚','💙','💜','🌸','🌼','⭐',
    '🌙','🍓','☕','🐶','🐱','🎵','💡','🦋','🍰','☁','🌷','🪐'
];
const emojiWrap = document.getElementById('emojiWrap');
emojiList.forEach(e=>{
    const span = document.createElement('span');
    span.className = 'emoji-item';
    span.innerText = e;
    span.onclick = ()=>{
        // 点击表情，插入到输入框光标位置
        const input = document.getElementById('diaryInput');
        const pos = input.selectionStart;
        const val = input.value;
        input.value = val.slice(0,pos)+e+val.slice(pos);
        input.selectionStart = input.selectionEnd = pos+1;
        input.focus();
    }
    emojiWrap.appendChild(span);
})

// 获取日期
function getDateStr(){
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
}
document.getElementById('nowDate').innerText = getDateStr();

const mask = document.getElementById('diaryMask');
const diaryInput = document.getElementById('diaryInput');

function openDiary(){
    mask.style.display = 'flex';
    // 读取本地存的今天日记
    const key = 'diary_'+getDateStr();
    diaryInput.value = localStorage.getItem(key) || '';
}
function closeDiary(){
    mask.style.display = 'none';
}
function saveDiary(){
    const key = 'diary_'+getDateStr();
    localStorage.setItem(key, diaryInput.value);
    alert('心情保存好啦💗');
    closeDiary();
}
// 点遮罩空白关闭
mask.onclick = (ev)=>{
    if(ev.target === mask) closeDiary();
}
</script>
</body>
</html>
