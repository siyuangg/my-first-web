<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>秘密空间</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#440036;
  font-family:"Microsoft Yahei",sans-serif;
  color:#ffddf5;
  padding:20px;
  position:relative;
  min-height:100vh;
}

/* 霓虹星空背景（和menu/index完全统一） */
.star-field{
  position:fixed;inset:0;pointer-events:none;z-index:1;
}
.meteor{
  position:absolute;
  width:80px;
  height:2px;
  background:linear-gradient(90deg,#ff88dd,transparent);
  border-radius:99px;
  opacity:0;
  filter:drop-shadow(0 0 6px #ff44bb);
}
.corner-star{
  position:absolute;
  color:#ffbbee;
  font-size:26px;
  filter:drop-shadow(0 0 8px #ff44bb);
  animation: blink 2.2s infinite;
}
.star-tl{top:10%;left:10%;}
.star-tr{top:10%;right:10%;animation-delay:0.6s;}
.star-bl{bottom:10%;left:10%;animation-delay:1.1s;}
.star-br{bottom:10%;right:10%;animation-delay:1.7s;}

@keyframes blink{
  0%,100%{opacity:0.2;transform:scale(0.75);}
  50%{opacity:1;transform:scale(1.2);}
}

/* 霓虹卡片样式 */
.card{
  background:#330028;
  border:2px solid #ff33aa;
  border-radius:14px;
  padding:30px;
  box-shadow:0 0 25px #ff33aa;
  max-width:500px;
  margin:40px auto;
  position:relative;
  z-index:10;
}

/* 登录 */
.login{
  display:block;
}
.login h2{
  text-align:center;
  color:#ffbbee;
  font-size:32px;
  text-shadow:0 0 10px #ff44bb;
  margin-bottom:30px;
}
.login input{
  width:100%;
  padding:16px;
  margin:10px 0;
  background:#22001a;
  border:2px solid #ff33aa;
  border-radius:8px;
  color:#ffddf5;
  font-size:18px;
  outline:none;
}
.login button{
  width:100%;
  padding:18px;
  margin-top:20px;
  background:#ff1188;
  color:#ffddf5;
  border:none;
  border-radius:8px;
  font-size:20px;
  font-weight:bold;
  box-shadow:0 0 15px #ff33aa;
  cursor:pointer;
  transition:0.3s;
}
.login button:hover{
  background:#ff33aa;
  box-shadow:0 0 25px #ff44bb;
}
.tip{
  text-align:center;
  margin-top:12px;
  color:#ff99dd;
  font-size:14px;
}

/* 主菜单 */
.menu{
  display:none;
  text-align:center;
}
.menu h2{
  color:#ffbbee;
  font-size:32px;
  text-shadow:0 0 10px #ff44bb;
  margin-bottom:30px;
}
.menu button{
  display:block;
  width:100%;
  margin:12px 0;
  padding:18px;
  background:transparent;
  border:2px solid #ff33aa;
  border-radius:10px;
  color:#ffddf5;
  font-size:19px;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}
.menu button:hover{
  background:#ff118866;
  box-shadow:0 0 15px #ff33aa;
}

/* 日历 */
.calendar{display:none;}
.calendar-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}
.calendar-header button{
  background:#ff33aa;
  color:white;
  border:none;
  padding:10px 14px;
  border-radius:8px;
  cursor:pointer;
}
.calendar-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:8px;
  text-align:center;
}
.calendar-grid .day{
  padding:10px;
  border-radius:8px;
  cursor:pointer;
  background:#550044;
}
.calendar-grid .day.active{
  background:#ff33aa;
  color:white;
}

/* 日记 */
.diary-editor{display:none;}
.diary-editor h3{
  color:#ffbbee;
  margin-bottom:15px;
  text-shadow:0 0 6px #ff44bb;
}
#diary-content{
  width:100%;
  height:180px;
  padding:12px;
  background:#22001a;
  border:2px solid #ff33aa;
  border-radius:10px;
  color:#ffddf5;
  font-size:15px;
  resize:none;
  margin-bottom:10px;
  outline:none;
}
.toolbar{
  display:flex;
  gap:8px;
  margin-bottom:10px;
}
.toolbar button{
  padding:8px 10px;
  background:#550044;
  border:1px solid #ff33aa;
  border-radius:8px;
  color:#ffddf5;
  cursor:pointer;
}
.emoji-panel{
  display:none;
  grid-template-columns:repeat(10,1fr);
  gap:5px;
  margin-bottom:10px;
  max-height:150px;
  overflow-y:auto;
}
.emoji{
  font-size:20px;
  cursor:pointer;
  text-align:center;
}
#image-preview{
  max-width:100%;
  border-radius:10px;
  display:none;
  margin:10px 0;
}
.action-buttons{
  display:flex;
  gap:10px;
  margin-top:15px;
}
.action-buttons button{
  flex:1;
  padding:12px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}
#save-diary{
  background:#ff33aa;
  color:white;
}
#back-to-calendar{
  background:#550044;
  color:#ffddf5;
}

/* 音乐 */
.music{display:none;}
.music h3{
  text-align:center;
  color:#ffbbee;
  margin-bottom:20px;
  text-shadow:0 0 6px #ff44bb;
}
.music-input{
  display:flex;
  gap:8px;
  margin-bottom:15px;
}
.music-input input{
  flex:1;
  padding:10px;
  background:#22001a;
  border:2px solid #ff33aa;
  border-radius:10px;
  color:#ffddf5;
  outline:none;
}
.music-input button{
  padding:0 14px;
  background:#ff33aa;
  color:white;
  border:none;
  border-radius:10px;
  cursor:pointer;
}
.music-item{
  padding:12px;
  background:#550044;
  border-radius:10px;
  margin-bottom:8px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.music-item a{
  color:#ffddf5;
  text-decoration:none;
}
.music-item button{
  background:#ff4444;
  color:white;
  border:none;
  padding:5px 8px;
  border-radius:6px;
  cursor:pointer;
  font-size:12px;
}

/* 备忘录 */
.memo{display:none;}
.memo h3{
  text-align:center;
  color:#ffbbee;
  margin-bottom:20px;
  text-shadow:0 0 6px #ff44bb;
}
.memo textarea{
  width:100%;
  height:120px;
  padding:12px;
  background:#22001a;
  border:2px solid #ff33aa;
  border-radius:10px;
  color:#ffddf5;
  resize:none;
  outline:none;
  margin-bottom:10px;
}
.memo-add{
  text-align:right;
  margin-bottom:15px;
}
.memo-add button{
  padding:8px 16px;
  background:#ff33aa;
  color:white;
  border:none;
  border-radius:10px;
  cursor:pointer;
}
.memo-item{
  padding:12px;
  background:#550044;
  border-radius:10px;
  margin-bottom:8px;
  position:relative;
}
.memo-item button{
  position:absolute;
  right:8px;top:8px;
  background:#ff4444;
  color:white;
  border:none;
  padding:4px 7px;
  border-radius:6px;
  cursor:pointer;
  font-size:12px;
}

/* 返回按钮 */
.back-btn{
  margin-top:20px;
  padding:10px 20px;
  background:#550044;
  color:#ffddf5;
  border:1px solid #ff33aa;
  border-radius:10px;
  cursor:pointer;
  display:block;
  margin-left:auto;
  margin-right:auto;
}
</style>
</head>

<body>

<div class="star-field">
  <div class="corner-star star-tl">✦</div>
  <div class="corner-star star-tr">✦</div>
  <div class="corner-star star-bl">✦</div>
  <div class="corner-star star-br">✦</div>
</div>

<!-- 登录 -->
<div class="card login" id="login">
  <h2>🔒 秘密空间</h2>
  <input type="password" id="password" placeholder="请输入密码" />
  <button onclick="login()">进入</button>
  <div class="tip">密码已在 start.html 设置完成</div>
</div>

<!-- 菜单 -->
<div class="card menu" id="menu">
  <h2>✨ 秘密空间</h2>
  <button onclick="openCalendar()">📅 日历日记</button>
  <button onclick="openMusic()">🎵 音乐收藏</button>
  <button onclick="openMemo()">📝 私密备忘录</button>
  <button onclick="logout()">🚪 退出登录</button>
</div>

<!-- 日历 -->
<div class="card calendar" id="calendar">
  <div class="calendar-header">
    <button onclick="prevMonth()">←</button>
    <h3 id="calendar-title">2025年12月</h3>
    <button onclick="nextMonth()">→</button>
  </div>
  <div class="calendar-grid" id="calendar-grid"></div>
  <button class="back-btn" onclick="backToMenu()">返回菜单</button>
</div>

<!-- 日记 -->
<div class="card diary-editor" id="diary-editor">
  <h3 id="diary-date">2025-12-25</h3>
  <div class="toolbar">
    <button onclick="toggleEmoji()">😊 表情</button>
    <button onclick="document.getElementById('image-input').click()">🖼️ 贴图</button>
    <button onclick="removeBackground()">🧩 抠图</button>
  </div>
  <div class="emoji-panel" id="emoji-panel"></div>
  <input type="file" id="image-input" accept="image/*" style="display:none;" onchange="previewImage(event)">
  <img id="image-preview">
  <textarea id="diary-content" placeholder="开始写今天的心情吧..."></textarea>
  <div class="action-buttons">
    <button id="save-diary" onclick="saveDiary()">💾 保存</button>
    <button id="back-to-calendar" onclick="closeDiary()">↩ 返回</button>
  </div>
</div>

<!-- 音乐 -->
<div class="card music" id="music">
  <h3>🎵 音乐收藏</h3>
  <div class="music-input">
    <input id="music-name" placeholder="歌曲名">
    <input id="music-url" placeholder="音乐链接">
    <button onclick="addMusic()">添加</button>
  </div>
  <div id="music-list"></div>
  <button class="back-btn" onclick="backToMenu()">返回菜单</button>
</div>

<!-- 备忘录 -->
<div class="card memo" id="memo">
  <h3>📝 私密备忘录</h3>
  <textarea id="memo-content" placeholder="写下想记住的小事..."></textarea>
  <div class="memo-add">
    <button onclick="addMemo()">保存备忘</button>
  </div>
  <div id="memo-list"></div>
  <button class="back-btn" onclick="backToMenu()">返回菜单</button>
</div>

<script src="https://unpkg.com/@imgly/background-removal@1.0.5/dist/index.umd.js"></script>
<script>
let currentDate = "";
let currentImg = null;

// 登录
function login() {
  const realPwd = localStorage.getItem("hostPwd");
  const inputPwd = document.getElementById("password").value.trim();
  if (!realPwd) {
    alert("请先去 start.html 设置身份！");
    return;
  }
  if (inputPwd === realPwd) {
    document.getElementById("login").style.display = "none";
    document.getElementById("menu").style.display = "block";
  } else {
    alert("密码错误");
  }
}

// 退出
function logout() {
  document.getElementById("menu").style.display = "none";
  document.getElementById("login").style.display = "block";
  document.getElementById("password").value = "";
}

// 返回菜单
function backToMenu() {
  hideAll();
  document.getElementById("menu").style.display = "block";
}

function hideAll() {
  document.getElementById("calendar").style.display = "none";
  document.getElementById("diary-editor").style.display = "none";
  document.getElementById("music").style.display = "none";
  document.getElementById("memo").style.display = "none";
}

// ====================== 日历日记 ======================
let now = new Date();
let year = now.getFullYear();
let month = now.getMonth();

function renderCalendar() {
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const grid = document.getElementById("calendar-grid");
  grid.innerHTML = "";
  document.getElementById("calendar-title").innerText = `${year}年${month + 1}月`;

  for (let i = 0; i < firstDay; i++) grid.appendChild(document.createElement("div"));
  for (let d = 1; d <= daysInMonth; d++) {
    const day = document.createElement("div");
    day.classList.add("day");
    day.innerText = d;
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    day.onclick = () => openDiary(dateStr);
    grid.appendChild(day);
  }
}

function prevMonth() {
  month--;
  if (month < 0) { month = 11; year--; }
  renderCalendar();
}

function nextMonth() {
  month++;
  if (month > 11) { month = 0; year++; }
  renderCalendar();
}

function openCalendar() {
  hideAll();
  document.getElementById("calendar").style.display = "block";
  renderCalendar();
}

function openDiary(date) {
  currentDate = date;
  document.getElementById("diary-date").innerText = "🗓️ " + date;
  document.getElementById("calendar").style.display = "none";
  document.getElementById("diary-editor").style.display = "block";
  document.getElementById("image-preview").style.display = "none";
  document.getElementById("emoji-panel").style.display = "none";
  document.getElementById("diary-content").value = localStorage.getItem("diary_" + date) || "";
}

function closeDiary() {
  document.getElementById("diary-editor").style.display = "none";
  document.getElementById("calendar").style.display = "block";
}

function saveDiary() {
  localStorage.setItem("diary_" + currentDate, document.getElementById("diary-content").value);
  alert("✅ 保存成功！");
}

// Emoji
const emojis = ["😀","😊","😢","😡","😱","🤔","😴","😎","🥳","😭","❤️","🧡","💛","💚","💙","💜","🌸","☀️","⭐","🌙","🍓","☕","🐶","🐱","🎵","💡"];
function loadEmoji() {
  const panel = document.getElementById("emoji-panel");
  panel.innerHTML = "";
  emojis.forEach(e => {
    const div = document.createElement("div");
    div.className = "emoji";
    div.innerText = e;
    div.onclick = () => { document.getElementById("diary-content").value += e; };
    panel.appendChild(div);
  });
}
function toggleEmoji() {
  const p = document.getElementById("emoji-panel");
  p.style.display = p.style.display === "grid" ? "none" : "grid";
  loadEmoji();
}

// 贴图 & 抠图
function previewImage(e) {
  const file = e.target.files[0];
  if (!file) return;
  currentImg = file;
  const url = URL.createObjectURL(file);
  const img = document.getElementById("image-preview");
  img.src = url;
  img.style.display = "block";
}
async function removeBackground() {
  if (!currentImg) { alert("请先选择图片！"); return; }
  try {
    const blob = await bgrem.remove(currentImg);
    document.getElementById("image-preview").src = URL.createObjectURL(blob);
    alert("✅ 抠图完成！");
  } catch (e) {
    alert("抠图失败");
  }
}

// ====================== 音乐 ======================
function openMusic() {
  hideAll();
  document.getElementById("music").style.display = "block";
  renderMusic();
}
function renderMusic() {
  const list = JSON.parse(localStorage.getItem("musicList")) || [];
  const box = document.getElementById("music-list");
  box.innerHTML = "";
  list.forEach((item, i) => {
    const div = document.createElement("div");
    div.className = "music-item";
    div.innerHTML = `<a href="${item.url}" target="_blank">${item.name}</a><button onclick="delMusic(${i})">删除</button>`;
    box.appendChild(div);
  });
}
function addMusic() {
  const name = document.getElementById("music-name").value.trim();
  const url = document.getElementById("music-url").value.trim();
  if (!name || !url) { alert("请填写完整！"); return; }
  const list = JSON.parse(localStorage.getItem("musicList")) || [];
  list.push({ name, url });
  localStorage.setItem("musicList", JSON.stringify(list));
  document.getElementById("music-name").value = "";
  document.getElementById("music-url").value = "";
  renderMusic();
}
function delMusic(i) {
  const list = JSON.parse(localStorage.getItem("musicList")) || [];
  list.splice(i, 1);
  localStorage.setItem("musicList", JSON.stringify(list));
  renderMusic();
}

// ====================== 备忘录 ======================
function openMemo() {
  hideAll();
  document.getElementById("memo").style.display = "block";
  renderMemo();
}
function renderMemo() {
  const list = JSON.parse(localStorage.getItem("memoList")) || [];
  const box = document.getElementById("memo-list");
  box.innerHTML = "";
  list.forEach((item, i) => {
    const div = document.createElement("div");
    div.className = "memo-item";
    div.innerHTML = `${item.content}<button onclick="delMemo(${i})">删</button>`;
    box.appendChild(div);
  });
}
function addMemo() {
  const content = document.getElementById("memo-content").value.trim();
  if (!content) { alert("内容不能为空！"); return;
  }
  const list = JSON.parse(localStorage.getItem("memoList")) || [];
  list.push({ content });
  localStorage.setItem("memoList", JSON.stringify(list));
  document.getElementById("memo-content").value = "";
  renderMemo();
}
function delMemo(i) {
  const list = JSON.parse(localStorage.getItem("memoList")) || [];
  list.splice(i, 1);
  localStorage.setItem("memoList", JSON.stringify(list));
  renderMemo();
}

// 流星效果
const field = document.querySelector('.star-field');
function createMeteor(){
  const m = document.createElement('div');
  m.className = 'meteor';
  const w=window.innerWidth,h=window.innerHeight;
  let startX,startY,endX,endY;
  const side=Math.floor(Math.random()*4);
  switch(side){
    case 0:startX=0;startY=0;endX=w*0.35;endY=h*0.35;break;
    case 1:startX=w;startY=0;endX=w*0.65;endY=h*0.35;break;
    case 2:startX=0;startY=h;endX=w*0.35;endY=h*0.65;break;
    case 3:startX=w;startY=h;endX=w*0.65;endY=h*0.65;break;
  }
  m.style.left=startX+'px';m.style.top=startY+'px';
  field.appendChild(m);
  m.animate([
    {opacity:0,transform:'translate(0,0)'},
    {opacity:1},{opacity:0,transform:`translate(${endX-startX}px,${endY-startY}px)`}
  ],{duration:1200+Math.random()*1200,easing:'linear'});
  setTimeout(()=>m.remove(),2500);
}
function loopMeteor(){
  createMeteor();
  setTimeout(loopMeteor,1500+Math.random()*2500);
}
loopMeteor();
</script>

</body>
</html>
