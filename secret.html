<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>我的秘密空间</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Microsoft YaHei", sans-serif;
    }

    body {
      background: #fdf6f9;
      color: #444;
      padding: 20px;
    }

    /* 登录页 */
    .login {
      max-width: 350px;
      margin: 100px auto;
      text-align: center;
      padding: 30px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 0 20px #00000010;
      display: block;
    }

    .login h2 {
      margin-bottom: 20px;
      color: #d17fa9;
    }

    .login input {
      width: 100%;
      padding: 12px;
      border: 1px solid #eee;
      border-radius: 10px;
      margin-bottom: 15px;
      font-size: 16px;
    }

    .login button {
      width: 100%;
      padding: 12px;
      background: #d17fa9;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }
    .tip{
      margin-top:12px;
      font-size:14px;
      color:#888;
    }

    /* 主菜单 */
    .menu {
      display: none;
      text-align: center;
      margin-top: 50px;
    }

    .menu h2 {
      color: #d17fa9;
      margin-bottom: 30px;
    }

    .menu button {
      display: block;
      width: 220px;
      margin: 15px auto;
      padding: 15px;
      background: white;
      border: 2px solid #d17fa9;
      border-radius: 15px;
      font-size: 16px;
      cursor: pointer;
      color: #d17fa9;
      font-weight: bold;
    }

    /* 日历 */
    .calendar {
      display: none;
      max-width: 500px;
      margin: 30px auto;
      background: white;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 0 20px #00000010;
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .calendar-header button {
      background: #d17fa9;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      text-align: center;
    }

    .calendar-grid .day {
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      background: #f9f1f5;
    }

    .calendar-grid .day.active {
      background: #d17fa9;
      color: white;
    }

    /* 日记编辑器 */
    .diary-editor {
      display: none;
      max-width: 500px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 0 20px #00000010;
    }

    .diary-editor h3 {
      color: #d17fa9;
      margin-bottom: 15px;
    }

    #diary-content {
      width: 100%;
      height: 180px;
      padding: 12px;
      border: 1px solid #eee;
      border-radius: 10px;
      font-size: 15px;
      resize: none;
      margin-bottom: 10px;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .toolbar button {
      padding: 8px 10px;
      background: #f9f1f5;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    /* Emoji面板 */
    .emoji-panel {
      display: none;
      grid-template-columns: repeat(10, 1fr);
      gap: 5px;
      margin-bottom: 10px;
      max-height: 150px;
      overflow-y: auto;
    }

    .emoji {
      font-size: 20px;
      cursor: pointer;
      text-align: center;
    }

    /* 图片预览 */
    #image-preview {
      margin-top: 10px;
      max-width: 100%;
      border-radius: 10px;
      display: none;
    }

    /* 保存/返回按钮 */
    .action-buttons {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .action-buttons button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    #save-diary {
      background: #d17fa9;
      color: white;
    }

    #back-to-calendar {
      background: #eee;
      color: #666;
    }
  </style>
</head>

<body>
  <!-- 登录 -->
  <div class="login" id="login">
    <h2>🔒 秘密空间</h2>
    <input type="password" id="password" placeholder="请输入在start页面设置的密码" />
    <button onclick="login()">进入</button>
    <div class="tip">⚠️ 密码需要先去 start.html 里面设置，本页面不能设置密码</div>
  </div>

  <!-- 菜单 -->
  <div class="menu" id="menu">
    <h2>✨ 秘密空间</h2>
    <button onclick="openCalendar()">📅 日历日记</button>
    <button onclick="alert('功能即将上线～')">🎧 音乐收藏</button>
    <button onclick="alert('功能即将上线～')">📝 私密备忘录</button>
    <button onclick="logout()">🚪 退出登录</button>
  </div>

  <!-- 日历 -->
  <div class="calendar" id="calendar">
    <div class="calendar-header">
      <button onclick="prevMonth()">←</button>
      <h3 id="calendar-title">2025年12月</h3>
      <button onclick="nextMonth()">→</button>
    </div>
    <div class="calendar-grid" id="calendar-grid"></div>
    <div style="text-align:center; margin-top:20px;">
      <button onclick="backToMenu()" style="padding:10px 20px;background:#eee; border:none; border-radius:10px;cursor:pointer;">
        返回菜单
      </button>
    </div>
  </div>

  <!-- 日记编辑器 -->
  <div class="diary-editor" id="diary-editor">
    <h3 id="diary-date">2025-12-25</h3>
    <div class="toolbar">
      <button onclick="toggleEmoji()">😊 表情</button>
      <button onclick="document.getElementById('image-input').click()">🖼️ 贴图</button>
      <button onclick="removeBackground()" id="remove-bg-btn">🧩 抠图</button>
    </div>
    <div class="emoji-panel" id="emoji-panel"></div>
    <input type="file" id="image-input" accept="image/*" style="display:none;" onchange="previewImage(event)">
    <img id="image-preview" alt="预览图">
    <textarea id="diary-content" placeholder="开始写今天的心情吧..."></textarea>
    <div class="action-buttons">
      <button id="save-diary" onclick="saveDiary()">💾 保存日记</button>
      <button id="back-to-calendar" onclick="closeDiary()">↩ 返回日历</button>
    </div>
  </div>

  <script src="https://unpkg.com/@imgly/background-removal@1.0.5/dist/index.umd.js"></script>
  <script>
    let currentDate = "";
    let currentImg = null;

    // 【重点：只读取start存的userPwd，secret不提供设置密码功能！】
    function login() {
      const setPwd = localStorage.getItem("userPwd");
      const inputPwd = document.getElementById("password").value.trim();
      if (!setPwd) {
        alert("还没有设置密码！请先打开 start.html 完成密码设置");
        return;
      }
      if (inputPwd === setPwd) {
        document.getElementById("login").style.display = "none";
        document.getElementById("menu").style.display = "block";
      } else {
        alert("密码错误，和start设置的不一致！");
      }
    }

    // 退出
    function logout() {
      document.getElementById("menu").style.display = "none";
      document.getElementById("login").style.display = "block";
      document.getElementById("password").value = "";
    }

    // 返回菜单
    function backToMenu() {
      document.getElementById("calendar").style.display = "none";
      document.getElementById("menu").style.display = "block";
    }

    // 日历逻辑
    let now = new Date();
    let year = now.getFullYear();
    let month = now.getMonth();

    function renderCalendar() {
      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const grid = document.getElementById("calendar-grid");
      grid.innerHTML = "";
      document.getElementById("calendar-title").innerText = `${year}年${month + 1}月`;

      for (let i = 0; i < firstDay; i++) {
        const empty = document.createElement("div");
        grid.appendChild(empty);
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const day = document.createElement("div");
        day.classList.add("day");
        day.innerText = d;
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        day.onclick = () => openDiary(dateStr);
        grid.appendChild(day);
      }
    }

    function prevMonth() {
      month--;
      if (month < 0) {
        month = 11;
        year--;
      }
      renderCalendar();
    }

    function nextMonth() {
      month++;
      if (month > 11) {
        month = 0;
        year++;
      }
      renderCalendar();
    }

    // 打开日历
    function openCalendar() {
      document.getElementById("menu").style.display = "none";
      document.getElementById("calendar").style.display = "block";
      renderCalendar();
    }

    // 打开日记
    function openDiary(date) {
      currentDate = date;
      document.getElementById("diary-date").innerText = "🗓️ " + date;
      document.getElementById("calendar").style.display = "none";
      document.getElementById("diary-editor").style.display = "block";
      document.getElementById("image-preview").style.display = "none";
      document.getElementById("emoji-panel").style.display = "none";

      const saved = localStorage.getItem("diary_" + date);
      document.getElementById("diary-content").value = saved || "";
    }

    // 关闭日记
    function closeDiary() {
      document.getElementById("diary-editor").style.display = "none";
      document.getElementById("calendar").style.display = "block";
    }

    // 保存日记
    function saveDiary() {
      const content = document.getElementById("diary-content").value;
      localStorage.setItem("diary_" + currentDate, content);
      alert("✅ 日记保存成功！");
    }

    // Emoji
    const emojis = ["😀","😊","😢","😡","😱","🤔","😴","😎","🥳","😭","❤️","🧡","💛","💚","💙","💜","🖤","🌸","🌼","🌱","🌲","☀️","⭐","🌙","🌧️","❄️","🍎","🍇","🍉","🍓","🍞","🍔","🍟","🍕","☕","🍵","🍶","🐶","🐱","🐭","🐹","🐰","🦊","🐻","🐼","🐨","🍄","🌍","🚗","✈️","🚀","🎁","🎨","🎵","📷","📝","💡","🔑","❤️","🧸","🎀","🛍️","🥤","🍰"];

    function loadEmoji() {
      const panel = document.getElementById("emoji-panel");
      panel.innerHTML = "";
      emojis.forEach(e => {
        const div = document.createElement("div");
        div.classList.add("emoji");
        div.innerText = e;
        div.onclick = () => insertEmoji(e);
        panel.appendChild(div);
      });
    }

    function toggleEmoji() {
      const panel = document.getElementById("emoji-panel");
      panel.style.display = panel.style.display === "grid" ? "none" : "grid";
      loadEmoji();
    }

    function insertEmoji(e) {
      const area = document.getElementById("diary-content");
      area.value += e;
    }

    // 贴图
    function previewImage(event) {
      const file = event.target.files[0];
      if (!file) return;
      const url = URL.createObjectURL(file);
      const img = document.getElementById("image-preview");
      img.src = url;
      img.style.display = "block";
      currentImg = file;
    }

    // 抠图
    async function removeBackground() {
      if (!currentImg) {
        alert("请先选择一张图片！");
        return;
      }
      try {
        const resultBlob = await bgrem.remove(currentImg);
        const url = URL.createObjectURL(resultBlob);
        document.getElementById("image-preview").src = url;
        alert("✅ 抠图完成！背景已变透明");
      } catch (e) {
        console.error(e);
        alert("抠图失败");
      }
    }
  </script>
</body>
</html>
