<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>秘密房间</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  width:100vw;height:100vh;
  background:#111;
  display:flex;justify-content:center;align-items:center;
  font-family:"微软雅黑",sans-serif;
  color:#fff;
}
.lock-box{
  background:#222;
  padding:60px 50px;
  border-radius:15px;
  border:2px solid #ffcc00;
  box-shadow:0 0 30px #ffaa00;
  text-align:center;
}
h1{
  font-size:36px;
  color:#ffdd99;
  text-shadow:0 0 10px #ffaa00;
  margin-bottom:20px;
}
input{
  width:100%;
  padding:14px;
  margin:10px 0;
  font-size:18px;
  background:#000;
  border:2px solid #ffaa00;
  border-radius:8px;
  color:#ffdd99;
  outline:none;
}
button{
  width:100%;
  padding:15px;
  margin-top:15px;
  font-size:20px;
  background:#ff9900;
  color:#000;
  font-weight:bold;
  border:none;
  border-radius:8px;
  cursor:pointer;
}
#success{
  display:none;
  text-align:center;
  color:#0f0;
  font-size:40px;
  text-shadow:0 0 20px #0f0;
}
</style>
</head>
<body>
<div class="lock-box" id="lock">
  <h1>🔒 秘密房间 · 身份验证</h1>
  <input type="password" id="inputPwd" placeholder="请输入专属密码">
  <button onclick="checkPwd()">✅ 验证进入</button>
</div>

<div id="success">
  ✅ 验证成功<br>
  欢迎回来，宿主！<br>
  这里是你的专属秘密空间
</div>

<script>
function checkPwd(){
  let realPwd = localStorage.getItem("hostPwd");
  let input = document.getElementById("inputPwd").value;
  
  if(input === realPwd){
    document.getElementById("lock").style.display="none";
    document.getElementById("success").style.display="block";
  }else{
    alert("❌ 密码错误！无权进入秘密房间！");
  }
}
</script>
</body>
</html>
