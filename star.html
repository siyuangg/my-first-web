<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>星空露台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        @keyframes fadeIn { to { opacity:1; } }
        @keyframes fadeOut {
            from { opacity:1; }
            to { opacity:0; }
        }
        @keyframes twinkle {
            0%,100% { opacity:0.25; }
            50% { opacity:1; }
        }
        @keyframes meteor {
            0% {
                transform: translateX(0) translateY(0);
                opacity: 1;
            }
            100% {
                transform: translateX(-320px) translateY(240px);
                opacity: 0;
            }
        }
        body {
            opacity: 0;
            animation: fadeIn 1.2s ease forwards;
            background: #080516;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #d8d0ff;
            font-family: "微软雅黑", monospace;
            position: relative;
            overflow-x: hidden;
            padding: 20px;
        }
        /* 星星 */
        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: twinkle ease-in-out infinite;
            z-index: 1;
            pointer-events: none;
        }
        /* 流星 */
        .meteor{
            position:absolute;
            height:1px;
            background: linear-gradient(to left, #fff, transparent);
            animation: meteor 1.2s linear forwards;
            z-index:1;
            pointer-events:none;
        }
        .wrap {
            text-align:center;
            z-index: 2;
            width: 100%;
            max-width:700px;
        }
        h1 {
            font-size:42px;
            margin-bottom: 8px;
            text-shadow: 0 0 12px #b4a0ff;
        }
        .sub-title{
            margin-bottom:24px;
            color:#b8a8ee;
        }
        .card{
            background:#0c0920;
            border:1px solid #604499;
            border-radius:12px;
            padding:20px;
            margin-bottom:16px;
            text-align:left;
        }
        .card-title{
            font-size:18px;
            margin-bottom:12px;
            color:#c3b2f0;
        }
        textarea{
            width:100%;
            padding:10px;
            margin:6px 0;
            background:#080516;
            border:1px solid #604499;
            color:#d8d0ff;
            border-radius:6px;
            min-height:120px;
            resize:vertical;
        }
        .btn-row{
            display:flex;
            gap:10px;
            flex-wrap:wrap;
            margin-top:10px;
        }
        button{
            padding:10px 16px;
            border:1px solid #7755bb;
            background:#0c0920;
            color:#d8d0ff;
            cursor:pointer;
            transition:0.3s;
            border-radius:6px;
        }
        button:hover {
            background:#251844;
            box-shadow:0 0 12px #8866dd;
        }
        .wish-item{
            padding:10px;
            margin:8px 0;
            border-radius:6px;
            background:#0a071b;
            position:relative;
            box-shadow: 0 0 6px #503888;
            transition: 0.3s;
        }
        .wish-item:hover{
            box-shadow: 0 0 14px #7755bb;
        }
        .wish-del{
            position:absolute;
            right:8px;
            top:6px;
            font-size:12px;
            padding:2px 6px;
        }
        .back-btn {
            width:100%;
            padding:14px;
            font-size:18px;
            margin-top:8px;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>🌌 星空露台</h1>
        <div class="sub-title"></div>

        <div class="card">
            <div class="card-title">✨ 星空心愿</div>
            <textarea id="wishInput" placeholder="写下心愿，托付给星星……"></textarea>
            <div class="btn-row">
                <button onclick="addWish()">寄存心愿</button>
                <button onclick="clearAllWish()">清空全部心愿</button>
            </div>
            <div id="wishBox"></div>
        </div>

        <button class="back-btn" onclick="goBack()">返回菜单</button>
    </div>

    <script>
        // 随机星空短句
        const starSentences = [
            "星光替你接住没说出口的期待",
            "宇宙安静，心事可以慢慢放下来",
            "遥远星光，跨越长夜抵达这里",
            "仰望的时候，不必急着有答案",
            "黑夜承载星光，也承载你的心愿",
            "晚风穿过星河，捎走你的愿望",
            "在星空之下，允许自己暂时放空"
        ];
        const subTitleDom = document.querySelector('.sub-title');
        subTitleDom.innerText = starSentences[Math.floor(Math.random() * starSentences.length)];

        // 生成星星，每个星星闪烁速度不一样
        for(let i=0; i<120; i++){
            const s = document.createElement('div');
            s.className = 'star';
            const size = Math.random() * 2 + 1;
            const duration = Math.random() * 2 + 1.5;
            s.style.width = size + 'px';
            s.style.height = size + 'px';
            s.style.left = Math.random() * 100 + '%';
            s.style.top = Math.random() * 100 + '%';
            s.style.animationDuration = duration + 's';
            s.style.animationDelay = Math.random() * 3 + 's';
            document.body.appendChild(s);
        }

        // 流星定时生成
        function createMeteor(){
            const m = document.createElement('div');
            m.className = 'meteor';
            m.style.top = Math.random() * 40 + '%';
            m.style.right = '0px';
            document.body.appendChild(m);
            setTimeout(()=>{
                m.remove();
            },1200);
        }
        // 每隔一段时间随机出现流星
        setInterval(()=>{
            if(Math.random()>0.5){
                createMeteor();
            }
        }, 4500);


        const wishBox = document.getElementById('wishBox');
        const wishInput = document.getElementById('wishInput');
        let wishList = JSON.parse(localStorage.getItem('starWishList')) || [];

        function renderWish(){
            wishBox.innerHTML="";
            wishList.forEach((item,i)=>{
                const div=document.createElement("div");
                div.className="wish-item";
                div.innerHTML = `
                    ${item}
                    <button class="wish-del" onclick="delWish(${i})">收回</button>
                `;
                wishBox.appendChild(div);
            })
        }
        function addWish(){
            const text = wishInput.value.trim();
            if(!text) return;
            wishList.push(text);
            localStorage.setItem('starWishList',JSON.stringify(wishList));
            renderWish();
            wishInput.value="";
        }
        function delWish(i){
            wishList.splice(i,1);
            localStorage.setItem('starWishList',JSON.stringify(wishList));
            renderWish();
        }
        function clearAllWish(){
            if(confirm("确定要收回所有托付给星星的心愿吗？")){
                wishList = [];
                localStorage.setItem('starWishList',JSON.stringify(wishList));
                renderWish();
            }
        }

        function goBack(){
            document.body.style.animation = "fadeOut 0.9s ease forwards";
            setTimeout(()=>{
                location.href="menu.html";
            },800);
        }

        renderWish();
    </script>
</body>
</html>
